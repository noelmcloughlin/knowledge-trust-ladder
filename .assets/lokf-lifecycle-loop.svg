<text x="488" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#6E6D66">confirmed</text>
<line x1="278" y1="386" x2="215" y2="352" stroke="#6E6D66" stroke-width="1.3"/><path d="M223.0 351.2 L215 352 L218.7 359.1" fill="none" stroke="#6E6D66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="232" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#6E6D66">the miss</text>
<g transform="translate(348,306)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<g transform="translate(372,306)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<text x="360" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6E6D66">people · CI · agents</text>
<text x="360" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#5F5E5A">Cumulative and partial by design: confirmed-by-a-person rises slowly, and the report says so.</text>
<circle cx="52" cy="494" r="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="63" y="498" font-family="Arial, sans-serif" font-size="12" fill="#27500A">an agent derives it</text>
<circle cx="206" cy="494" r="5" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/>
<text x="217" y="498" font-family="Arial, sans-serif" font-size="12" fill="#7A4E0B">deterministic tools check it</text>
<circle cx="418" cy="494" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="429" y="498" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">a named person vouches for it</text>
</svg>
