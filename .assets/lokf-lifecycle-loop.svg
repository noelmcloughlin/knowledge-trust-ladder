<svg width="720" height="510" viewBox="0 0 720 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">First a sequence, then a loop</title>
<desc id="d">Top: on a fresh repository three steps run once in order: the sidecar lays .lokf/ from templates, the librarian fills the bundle with every concept marked a draft, the curator, a person, turns drafts into confirmed a few at a time. Bottom: after that it becomes a loop. The librarian refreshes on a schedule; the registrar checks every change via lokf validate, CI and the plugin; the curator works through whatever surfaced; the docent answers readers and records what the bundle missed, which becomes the librarian's next task. Readers, CI and agents sit in the middle of the ring.</desc>
<rect width="720" height="510" fill="#E4E1D7"/>
<!-- ktl-brand:start --><g transform="translate(20,7) scale(0.46875)"><rect x="17.5" y="12" width="4.5" height="38" rx="2.25" fill="#A8A69D"/><rect x="42" y="12" width="4.5" height="38" rx="2.25" fill="#A8A69D"/><rect x="17.5" y="38" width="29" height="5" rx="2.5" fill="#5F5E5A"/><rect x="17.5" y="28.5" width="29" height="5" rx="2.5" fill="#7A4E0B"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#E4E1D7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#0C447C" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 49.5 C26 45 15 45 6.5 47.5 v9.5 C15 54.5 26 54.5 32 59 C38 54.5 49 54.5 57.5 57 v-9.5 C49 45 38 45 32 49.5 z" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.7" stroke-linejoin="round"/><line x1="32" y1="49.5" x2="32" y2="59" stroke="#3B6D11" stroke-width="1.7"/><path d="M11 50.6 C16 49.6 22 49.8 27 51.6 M37 51.6 C42 49.8 48 49.6 53 50.6" fill="none" stroke="#3B6D11" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/></g><text x="56" y="20" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5F5E5A">Knowledge</text><text x="56" y="32.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#5F5E5A">Trust Ladder</text><!-- ktl-brand:end -->
<text x="360.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">First a sequence, then a loop</text>
<rect x="20" y="48" width="680" height="132" rx="20" fill="#F1EFE8"/>
<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">On a fresh repository: a sequence, run once</text>
<rect x="44" y="92" width="196" height="74" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(70,128)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 -6 h7 l3 3 h10 v11 h-20 z"/><line x1="0" y1="1" x2="0" y2="6"/><line x1="-2.5" y1="3.5" x2="2.5" y2="3.5"/></g>
<text x="94" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Sidecar</text>
<text x="94" y="134" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">lays .lokf/ from templates</text>
<text x="94" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6E6D66">once</text>
<rect x="262" y="92" width="196" height="74" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(288,128)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="16" rx="2"/><line x1="0" y1="-8" x2="0" y2="8"/></g>
<text x="312" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Librarian</text>
<text x="312" y="134" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">fills the bundle, all drafts</text>
<text x="312" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6E6D66">then, often</text>
<rect x="480" y="92" width="196" height="74" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<g transform="translate(506,128)" stroke="#0C447C" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-10" x2="0" y2="8"/><line x1="-10" y1="-10" x2="10" y2="-10"/><circle cx="-10" cy="-4" r="3" fill="#E6F1FB"/><circle cx="10" cy="-4" r="3" fill="#E6F1FB"/><line x1="-6" y1="8" x2="6" y2="8"/></g>
<text x="530" y="118" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">Curator</text>
<text x="530" y="134" font-family="Arial, sans-serif" font-size="10.5" fill="#0C447C">a person confirms drafts</text>
<text x="530" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6E6D66">then, a few at a time</text>
<line x1="246" y1="129" x2="258" y2="129" stroke="#6E6D66" stroke-width="1.3"/><path d="M251.4 133.5 L258 129 L251.4 124.5" fill="none" stroke="#6E6D66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="464" y1="129" x2="476" y2="129" stroke="#6E6D66" stroke-width="1.3"/><path d="M469.4 133.5 L476 129 L469.4 124.5" fill="none" stroke="#6E6D66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="196" width="680" height="274" rx="20" fill="#F1EFE8"/>
<text x="40" y="224" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">After that: a loop</text>
<rect x="45" y="297" width="170" height="58" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(67,326)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-8" width="20" height="16" rx="2"/><line x1="0" y1="-8" x2="0" y2="8"/></g>
<text x="87" y="318" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Librarian</text>
<text x="87" y="332" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">refreshes on a schedule</text>
<text x="87" y="345" font-family="Arial, sans-serif" font-size="9.5" fill="#6E6D66">changes land as drafts</text>
<rect x="275" y="223" width="170" height="58" rx="10" fill="#FBF1DE" stroke="#B7791F" stroke-width="2"/>
<g transform="translate(297,252)" stroke="#7A4E0B" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-8" y="-8" width="16" height="18" rx="2"/><path d="M-3 -10 h6 v3 h-6 z" fill="#FBF1DE"/><path d="M-4 2 l3 3 l5 -6"/></g>
<text x="317" y="244" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7A4E0B">Registrar</text>
<text x="317" y="258" font-family="Arial, sans-serif" font-size="10.5" fill="#7A4E0B">checks every change</text>
<text x="317" y="271" font-family="Arial, sans-serif" font-size="9.5" fill="#6E6D66">lokf validate · CI · plugin</text>
<rect x="505" y="297" width="170" height="58" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<g transform="translate(527,326)" stroke="#0C447C" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-10" x2="0" y2="8"/><line x1="-10" y1="-10" x2="10" y2="-10"/><circle cx="-10" cy="-4" r="3" fill="#E6F1FB"/><circle cx="10" cy="-4" r="3" fill="#E6F1FB"/><line x1="-6" y1="8" x2="6" y2="8"/></g>
<text x="547" y="318" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">Curator</text>
<text x="547" y="332" font-family="Arial, sans-serif" font-size="10.5" fill="#0C447C">works through the queue</text>
<text x="547" y="345" font-family="Arial, sans-serif" font-size="9.5" fill="#6E6D66">confirm · correct · retire</text>
<rect x="275" y="371" width="170" height="58" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<g transform="translate(297,400)" stroke="#27500A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="10"/><polygon points="0,-6 3,0 0,6 -3,0" fill="#27500A" stroke="none"/></g>
<text x="317" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#27500A">Docent</text>
<text x="317" y="406" font-family="Arial, sans-serif" font-size="10.5" fill="#27500A">answers readers</text>
<text x="317" y="419" font-family="Arial, sans-serif" font-size="9.5" fill="#6E6D66">records what was missed</text>
<line x1="215" y1="300" x2="278" y2="270" stroke="#6E6D66" stroke-width="1.3"/><path d="M274.0 276.9 L278 270 L270.1 268.8" fill="none" stroke="#6E6D66" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
