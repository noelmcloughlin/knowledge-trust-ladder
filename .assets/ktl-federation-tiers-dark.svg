<path d="M326.0 345.1 L330 352 L322.1 353.2" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="520" y1="290" x2="390" y2="352" stroke="#8F8E86" stroke-width="1.3"/>
<path d="M397.9 353.2 L390 352 L394.0 345.1" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#ABA9A0">The diamond rule: a bundle two domains name at one release joins once; named at two releases, it stops the build.</text>
<rect x="20" y="516" width="680" height="118" rx="12" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<g transform="translate(46,549)" stroke="#ABA9A0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-10" y="-10" width="20" height="20" rx="2"/><line x1="-6" y1="-4" x2="-4" y2="-4"/><line x1="-1" y1="-4" x2="6" y2="-4"/><line x1="-6" y1="0.5" x2="-4" y2="0.5"/><line x1="-1" y1="0.5" x2="6" y2="0.5"/><line x1="-6" y1="5" x2="-4" y2="5"/><line x1="-1" y1="5" x2="6" y2="5"/></g>
<text x="70" y="538" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E6E4DC">Four rules</text>
<text x="70" y="555" font-family="Arial, sans-serif" font-size="10" fill="#ABA9A0">Every domain bounds a workspace of its own: the domain a build starts from is its top, and may be a member of another.</text>
<text x="70" y="570" font-family="Arial, sans-serif" font-size="10" fill="#ABA9A0">Confirming a domain member attests that it belongs and who answers for it, not what its members say.</text>
<text x="70" y="585" font-family="Arial, sans-serif" font-size="10" fill="#ABA9A0">One bundle at one release, however many domains name it; named at two releases, it stops the build.</text>
<text x="70" y="600" font-family="Arial, sans-serif" font-size="10" fill="#ABA9A0">max_depth on the top domain says how many tiers the build follows, 3 unless set; a domain may not name one above it.</text>
<text x="70" y="615" font-family="Arial, sans-serif" font-size="10" fill="#ABA9A0">Namespaces may mirror the tree when each ends in its own segment: corp.example/legal/knowledge/ beside …/legal/lob-a/knowledge/.</text>
<circle cx="52" cy="658" r="5" fill="#23301B" stroke="#6FA33F" stroke-width="1"/>
<text x="63" y="662" font-family="Arial, sans-serif" font-size="12" fill="#A9D27C">an agent derives it</text>
<circle cx="206" cy="658" r="5" fill="#33290F" stroke="#C99A3E" stroke-width="1"/>
<text x="217" y="662" font-family="Arial, sans-serif" font-size="12" fill="#E4BD6E">deterministic tools check it</text>
<circle cx="418" cy="658" r="5" fill="#142639" stroke="#5A9BE0" stroke-width="1"/>
<text x="429" y="662" font-family="Arial, sans-serif" font-size="12" fill="#93C0F2">a named person vouches for it</text>
</svg>
