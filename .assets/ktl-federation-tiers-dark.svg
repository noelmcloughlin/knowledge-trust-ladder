<text x="554.0" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#A9D27C">repository C</text>
<text x="360" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#ABA9A0">Bundles: each on its own trust ladder, named by the tier above it.</text>
