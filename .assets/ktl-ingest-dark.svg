<text x="52" y="124" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E6E4DC">Confluence pages</text>
<text x="52" y="138" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">by label, space, page or tree</text>
<rect x="40" y="156" width="176" height="40" rx="10" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<text x="52" y="172" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E6E4DC">Pages and documents</text>
<text x="52" y="186" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">HTML, Markdown, text, PDF</text>
<rect x="40" y="204" width="176" height="40" rx="10" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<text x="52" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E6E4DC">Another repository</text>
<text x="52" y="234" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">a folder at a ref; a wiki</text>
<rect x="40" y="252" width="176" height="40" rx="10" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<text x="52" y="268" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E6E4DC">A command's output</text>
<text x="52" y="282" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">a client, a dump, an export</text>
