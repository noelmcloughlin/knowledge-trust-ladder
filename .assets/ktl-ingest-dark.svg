<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#E6E4DC">A copy comes in, is reviewed, and is cited like any tracked file</text>
<text x="40" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ABA9A0">Outside the repository</text>
