<text x="260" y="140" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">place, selector, owner, why; no token</text>
<path d="M356 154 L356 168" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M351.5 161.4 L356 168 L360.5 161.4" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="248" y="168" width="216" height="66" rx="10" fill="#33290F" stroke="#C99A3E" stroke-width="1"/>
<text x="260" y="184" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#E4BD6E">knowledge-ingest.sh</text>
<text x="260" y="199" font-family="Arial, sans-serif" font-size="9.5" fill="#E4BD6E">a read-only job, secrets by name</text>
<text x="260" y="212" font-family="Arial, sans-serif" font-size="9.5" fill="#E4BD6E">no agent runs; fetches what moved</text>
<text x="260" y="225" font-family="Arial, sans-serif" font-size="9.5" fill="#E4BD6E">and converts each page to Markdown</text>
