<text x="508" y="124" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#93C0F2">Pull request</text>
<text x="508" y="138" font-family="Arial, sans-serif" font-size="9.5" fill="#93C0F2">each Sunday, refreshed until merged</text>
<text x="508" y="151" font-family="Arial, sans-serif" font-size="9.5" fill="#93C0F2">the diff is the page; a person merges</text>
<text x="508" y="164" font-family="Arial, sans-serif" font-size="9.5" fill="#93C0F2">no agent reads it before that</text>
