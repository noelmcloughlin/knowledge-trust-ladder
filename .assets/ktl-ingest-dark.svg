<text x="260" y="264" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#A9D27C">.lokf/mirror/&lt;entry&gt;/</text>
<text x="260" y="278" font-family="Arial, sans-serif" font-size="9.5" fill="#A9D27C">one file per page: origin, version, digest</text>
<text x="260" y="296" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#A9D27C">.lokf/ingest.lock.yaml</text>
<text x="260" y="310" font-family="Arial, sans-serif" font-size="9.5" fill="#A9D27C">ok, gone, unlisted, failed, refused</text>
