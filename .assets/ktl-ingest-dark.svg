<text x="508" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#E6E4DC">The librarian, Monday</text>
<text x="508" y="218" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">the work list names each mirror</text>
<text x="508" y="231" font-family="Arial, sans-serif" font-size="9.5" fill="#ABA9A0">file that moved; it derives from it</text>
<path d="M588 244 L588 258" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M583.5 251.4 L588 258 L592.5 251.4" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="496" y="258" width="184" height="68" rx="10" fill="#23301B" stroke="#6FA33F" stroke-width="2"/>
<text x="508" y="274" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#A9D27C">Concept</text>
<text x="508" y="289" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#A9D27C">resource: the mirror file</text>
<text x="508" y="303" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#A9D27C">sources: the origin page</text>
<text x="508" y="318" font-family="Arial, sans-serif" font-size="9.5" fill="#A9D27C">agent-derived until a person confirms</text>
<text x="40" y="356" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#ABA9A0">Nothing fetched is knowledge yet. The secrets stay in the read-only job, the write token in a job with no secret,</text>
<text x="40" y="372" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#ABA9A0">and a mirror file holds the same place as any other repository content: reviewed before an agent reads it.</text>
