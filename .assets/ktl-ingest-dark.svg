<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Knowledge outside the repository</title>
<desc id="d">Left, four kinds of source outside the repository: Confluence pages, pages and documents at an address, files in another repository, and the output of a command. Middle, the ingest: .lokf/ingest.yaml names each source with no token; knowledge-ingest.sh runs in a read-only job with the secrets by name and no agent, fetches what moved and converts it to Markdown; it writes .lokf/mirror/, one file per page with origin, version and digest in its header, and .lokf/ingest.lock.yaml with a status per item. Right, the review: a pull request each Sunday, refreshed until merged, whose diff is the page and which a person merges; then the librarian on Monday, whose work list names each mirror file that moved; then a concept whose resource is the mirror file and whose sources name the origin page, agent-derived until a person confirms it. Below: nothing fetched is knowledge yet.</desc>
<rect width="720" height="420" fill="#1C1C1A"/>
