<svg width="720" height="784" viewBox="0 0 720 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Context layer</title>
<desc id="d">Top to bottom. Four sub-domain bundles, A to D, are each built and curated in their own repository on their own trust ladder. Each validates against a LinkML schema and projects to a graph: A and C against the LOKF schema, B and D against a domain schema that imports it. Each release is validated, packed, checksummed and attested into an artifact repository, which holds versioned releases of bundles today, and of domain schemas and manifests once a domain is built. Domains are manifests, not copies: Domain 1 selects bundles A and B, Domain 2 selects C and D, and the top domain selects both domains; a named person confirms each one's membership, and they are bound only when the workspace is built. The context layer is one traversable knowledge graph in a workspace bounded by the top domain, built ahead of time and refreshed on each release, with every trust label computed on read. Readers - agents, copilots and the people who ask them - traverse it on demand. The domain manifests and the context layer are drawn with a dashed outline: they are the design this page describes, not yet shipped; the bundles, the release step and the artifact repository are what a repository has today.</desc>
