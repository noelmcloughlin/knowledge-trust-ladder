<text x="70" y="538" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Four rules</text>
<text x="70" y="555" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">1. Every domain bounds a workspace of its own: the domain a build starts from is its top, and may be a member of another.</text>
<text x="70" y="570" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">2. Confirming a domain member attests that it belongs and who answers for it, not what its members say.</text>
<text x="70" y="585" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">3. The diamond rule: two domains may name the same bundle. At the same release it joins once; at different releases the build stops.</text>
<text x="70" y="600" font-family="Arial, sans-serif" font-size="10" fill="#5F5E5A">4. max_depth on the domain a build starts from says how many tiers it follows, 3 unless set; a domain may not name one above it.</text>
<text x="70" y="615" font-family="Arial, sans-serif" font-size="10" font-style="italic" fill="#5F5E5A">Each namespace is https://w3id.org/&lt;org&gt;/&lt;project&gt;/knowledge/, a domain's beside its members', never above them.</text>
<circle cx="52" cy="658" r="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="63" y="662" font-family="Arial, sans-serif" font-size="12" fill="#27500A">an agent derives it</text>
<circle cx="206" cy="658" r="5" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/>
<text x="217" y="662" font-family="Arial, sans-serif" font-size="12" fill="#7A4E0B">deterministic tools check it</text>
<circle cx="418" cy="658" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="429" y="662" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">a named person vouches for it</text>
</svg>
