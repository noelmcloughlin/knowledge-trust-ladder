<svg width="720" height="676" viewBox="0 0 720 676" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Tiers of domains</title>
<desc id="d">Top to bottom. Each domain is labelled with its domain concept's path and its namespace in the form https://w3id.org/, the publisher's own w3id namespace, the project, then knowledge/. domains/federation, where this build starts and perhaps a member of another domain, names domains/domain-1 and domains/domain-2; each is a thin LOKF bundle with its own curator and releases, and each names a domain in turn, domains/domain-3 and domains/domain-4. Those name the bundles: any number under each, one repository each, drawn as a stack of cards, and one shared model such as gist-linkml, biolink-model or the FINOS CDM, named by both at one release, so it joins once: the diamond rule. Each card carries a small ladder whose rungs are the three actors, and three pills reading derived, checked and confirmed: green for what an agent derived, gold for what deterministic tools checked, blue for what a named person confirmed; each domain box carries the same three dots. Four numbered rules follow: every domain bounds a workspace of its own; confirming a domain member attests that it belongs and who answers for it, not what its members say; the diamond rule, that a bundle two domains name joins once at the same release and stops the build at different releases; and max_depth on the domain a build starts from says how many tiers it follows, three unless set. A note says that every namespace takes that form, a domain's beside its members' and never above them.</desc>
