<text x="488" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8F8E86">confirmed</text>
<line x1="278" y1="386" x2="215" y2="352" stroke="#8F8E86" stroke-width="1.3"/><path d="M223.0 351.2 L215 352 L218.7 359.1" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="232" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8F8E86">the miss</text>
<g transform="translate(348,306)" stroke="#ABA9A0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<g transform="translate(372,306)" stroke="#ABA9A0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<text x="360" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8F8E86">people · CI · agents</text>
<text x="360" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#ABA9A0">Cumulative and partial by design: confirmed-by-a-person rises slowly, and the report says so.</text>
<circle cx="52" cy="494" r="5" fill="#23301B" stroke="#6FA33F" stroke-width="1"/>
<text x="63" y="498" font-family="Arial, sans-serif" font-size="12" fill="#A9D27C">an agent derives it</text>
<circle cx="206" cy="494" r="5" fill="#33290F" stroke="#C99A3E" stroke-width="1"/>
<text x="217" y="498" font-family="Arial, sans-serif" font-size="12" fill="#E4BD6E">deterministic tools check it</text>
<circle cx="418" cy="494" r="5" fill="#142639" stroke="#5A9BE0" stroke-width="1"/>
<text x="429" y="498" font-family="Arial, sans-serif" font-size="12" fill="#93C0F2">a named person vouches for it</text>
</svg>
