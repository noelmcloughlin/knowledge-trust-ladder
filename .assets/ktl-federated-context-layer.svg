<svg width="720" height="828" viewBox="0 0 720 828" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Many bundles, one context layer</title>
<desc id="d">Drawn bottom to top, from repository bundles to a context layer and its readers. At the bottom, bundles: one per repository, each on its own trust ladder. Four are drawn, A to D; A and C validate against LOKF core, B and D against a domain vocabulary, and each shows how many concepts a person confirmed. Once the registrar's checks pass, a bundle is packed and checksummed into the artifact repository: versioned releases of bundles and of domains, on GitHub a release, each a reproducible zip with its checksum, a domain vocabulary where the bundle has one, and an attestation where the forge offers one. Above it, domains: thin bundles that select releases. A member concept names a release by its address, tag and checksum. domains/federation, the top domain, selects two domains; domains/domain1 selects bundles A and B, and domains/domain2 selects bundles C and D. A person confirms each member that a domain selects, and nothing is copied upward. Each release is resolved, fetched and verified into the context layer: one workspace, with one named graph per bundle, keyed by its base_iri. A script builds it ahead of time, and again on each release of the top domain, and a trust label is computed when a query runs. At the top, the readers, agents, copilots and the people who ask them, read the index first and then traverse on demand.</desc>
