<svg width="720" height="784" viewBox="0 0 720 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Context layer</title>
<desc id="d">Bottom to top. Four sub-domain bundles, A to D, are each built and curated in their own repository on their own trust ladder. Each validates against a LinkML schema and projects to a graph: A and C against the LOKF schema, B and D against a domain schema that imports it. Each release is validated, packed, checksummed and attested into an artifact repository, which holds versioned releases of bundles today, and of domain schemas and manifests once a domain is built. Domains are manifests, not copies, each labelled with its domain concept's path: domains/domain1 selects bundles A and B, domains/domain2 selects C and D, and domains/federation, where the build starts, selects both domains; a named person confirms each one's membership, and they are bound only when the workspace is built. The context layer is one traversable knowledge graph in the workspace domains/federation bounds, built ahead of time and refreshed on each release, with every trust label computed on read. Readers - agents, copilots and the people who ask them - traverse it on demand. The domain manifests and the context layer shipped on 2026-10-16 as the sidecar's federation templates, with ktl-federation as the first host; the bundles, the release step and the artifact repository are what every repository has.</desc>
