<svg width="720" height="700" viewBox="0 0 720 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The three lines of defence</title>
<desc id="d">The three lines of defence with each KTL role in place. Above the lines, the governing body: the owners of the repository that holds the bundle, with two instruments, the organisation's rules for AI-assisted work and the curation policy. First line, which owns the work and its risk: the librarian, an agent, derives each record from a source it names, records its re-checks as process: and never as a person, and marks what it cannot settle status: draft, with a question; the curator, a named person, decides what the team accepts as true: confirm, correct, send back, retire, or leave for later, source first, then claim, then verdict, with an identity from the forge. Maker and checker: the agent cannot vouch, and the person does not derive. ktl-prose, on the maker's side, rewords a text before a person confirms it. The sidecar installs the tools and the gate. A pull request with its human: verdicts goes to the second line, which ensures compliance without owning the content: the registrar, programs. lokf validate runs on every change, and again as the gate in CI; the pen is the librarian's only way to write, and refuses a human: actor; knowledge-report.sh computes every trust label; the gate's provenance job ties each human: verdict to that person's approval or signature, with one logged exception, an approval from a required reviewer of an Environment. The registrar never judges truth. The evidence is written where an auditor can find it. Third line, independent assurance, drawn dashed because KTL does not supply it: a review by someone other than the authors. The bundle holds the evidence that such a reviewer needs: resource, sources, generated, verified, revision, excerpt and stale_after, the gate's logs, log.md, git, and knowledge-report.sh evidence. Outside the lines, where the reader is: the docent answers from the bundle, gives each concept's trust label, and reports what it could not answer to the librarian, as untrusted input.</desc>
