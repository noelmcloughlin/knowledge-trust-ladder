<text x="196" y="384" font-size="11.5" fill="#4A4944">The pen is the librarian's only way to write, and refuses a <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" font-style="normal" fill="#1C1C1A">human:</tspan> actor.</text>
