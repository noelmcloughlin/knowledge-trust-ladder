<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Trust stays visible</title>
<desc id="d">Three rungs a concept climbs, left to right: still a draft, written by the librarian and unchecked; checked by automation only, where lokf validate, CI or the LOKF Registrar re-checked that the source still matches; confirmed by a person, where a named human read the source and a verified event was appended. A dashed return path shows that editing, a passed review date, or being sent back drops a concept a rung. Chips list the other labels: retired, edited since confirmed, past its review date, how many concepts rely on it. A counter, Confirmed 12 of 40, is the number to watch; it is computed from frontmatter on every read and meant to rise slowly.</desc>
<rect width="720" height="360" fill="#ffffff"/>
<text x="360.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2C2C2A">Trust stays visible</text>
<rect x="20" y="48" width="680" height="214" rx="20" fill="#F1EFE8"/>
<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Every concept says how far it has been checked</text>
<rect x="44" y="92" width="176" height="96" rx="12" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<g transform="translate(132,116)" stroke="#5F5E5A" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-11" width="18" height="22" rx="2"/><line x1="-5" y1="-3" x2="5" y2="-3"/><line x1="-5" y1="2" x2="5" y2="2"/><line x1="-5" y1="7" x2="2" y2="7"/></g>
<text x="132" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Still a draft</text>
<text x="132" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">the librarian wrote it;</text>
<text x="132" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888780">nobody has checked this yet</text>
<rect x="272" y="92" width="176" height="96" rx="12" fill="#FBF1DE" stroke="#B7791F" stroke-width="2"/>
<g transform="translate(360,116)" stroke="#7A4E0B" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-8" y="-8" width="16" height="18" rx="2"/><path d="M-3 -10 h6 v3 h-6 z" fill="#FBF1DE"/><path d="M-4 2 l3 3 l5 -6"/></g>
<text x="360" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7A4E0B">Checked by automation</text>
<text x="360" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7A4E0B">lokf validate · CI · Registrar</text>
<text x="360" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888780">re-checked the source still matches</text>
<rect x="500" y="92" width="176" height="96" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<g transform="translate(588,116)" stroke="#0C447C" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<text x="588" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">Confirmed by a person</text>
<text x="588" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0C447C">a named person read the source</text>
<text x="588" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888780">verified: human:&lt;id&gt; appended</text>
<line x1="226" y1="140" x2="266" y2="140" stroke="#888780" stroke-width="1.3"/><path d="M259.4 144.5 L266 140 L259.4 135.5" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="246.0" y="132.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">tools</text>
<line x1="454" y1="140" x2="494" y2="140" stroke="#888780" stroke-width="1.3"/><path d="M487.4 144.5 L494 140 L487.4 135.5" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="474.0" y="132.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888780">person</text>
<path d="M588 188 v18 h-456 v-18" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="3 3"/>
<path d="M126 194 L132 187 L138 194" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#888780">edited since confirmed · past its review date · sent back - and it drops a rung</text>
<text x="40" y="232" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#5F5E5A">Also shown:</text>
<rect x="110" y="218" width="60" height="20" rx="10.0" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/><text x="140.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">retired</text>
<rect x="178" y="218" width="132" height="20" rx="10.0" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/><text x="244.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">edited since confirmed</text>
<rect x="318" y="218" width="118" height="20" rx="10.0" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/><text x="377.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">past its review date</text>
<rect x="444" y="218" width="160" height="20" rx="10.0" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/><text x="524.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">n other concepts rely on this</text>
<rect x="20" y="274" width="680" height="46" rx="12" fill="#ffffff" stroke="#D3D1C7" stroke-width="1"/>
<text x="40" y="293" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#2C2C2A">The number to watch</text>
<text x="40" y="309" font-family="Arial, sans-serif" font-size="10.5" fill="#888780">computed from the frontmatter on every read, never stored - so it cannot drift</text>
<rect x="418" y="286" width="118" height="22" rx="11.0" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/><text x="477.0" y="301.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Confirmed 12 / 40</text>
<text x="548" y="301" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">meant to rise slowly,</text>
<text x="548" y="313" font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A">a few concepts a sitting</text>
<circle cx="52" cy="344" r="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<text x="63" y="348" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">raw / unprocessed</text>
<circle cx="193" cy="344" r="5" fill="#FBF1DE" stroke="#B7791F" stroke-width="1"/>
<text x="204" y="348" font-family="Arial, sans-serif" font-size="12" fill="#7A4E0B">deterministic tools check it</text>
<circle cx="405" cy="344" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="416" y="348" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">a named person vouches for it</text>
</svg>
