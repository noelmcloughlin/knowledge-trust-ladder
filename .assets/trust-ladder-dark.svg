<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Trust stays visible</title>
<desc id="d">Three rungs a concept climbs, left to right: still a draft, written by the librarian and unchecked; checked by automation only, where lokf validate, CI or the KTL Registrar re-checked that the source still matches; confirmed by a person, where a named human read the source and a verified event was appended. A dashed return path shows that editing, a passed review date, or being sent back drops a concept a rung. Chips list the other labels: retired, edited since confirmed, past its review date, how many concepts rely on it. A counter, Confirmed 12 of 40, is the number to watch; it is computed from frontmatter on every read and meant to rise slowly.</desc>
<rect width="720" height="360" fill="#1C1C1A"/>
<!-- ktl-brand:start --><g transform="translate(20,7) scale(0.46875)"><rect x="17.5" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/><rect x="42" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/><rect x="17.5" y="38" width="29" height="5" rx="2.5" fill="#ABA9A0"/><rect x="17.5" y="28.5" width="29" height="5" rx="2.5" fill="#E4BD6E"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#1C1C1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#93C0F2" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 49.5 C26 45 15 45 6.5 47.5 v9.5 C15 54.5 26 54.5 32 59 C38 54.5 49 54.5 57.5 57 v-9.5 C49 45 38 45 32 49.5 z" fill="#23301B" stroke="#6FA33F" stroke-width="1.7" stroke-linejoin="round"/><line x1="32" y1="49.5" x2="32" y2="59" stroke="#6FA33F" stroke-width="1.7"/><path d="M11 50.6 C16 49.6 22 49.8 27 51.6 M37 51.6 C42 49.8 48 49.6 53 50.6" fill="none" stroke="#6FA33F" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/></g><text x="56" y="20" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ABA9A0">Knowledge</text><text x="56" y="32.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ABA9A0">Trust Ladder</text><!-- ktl-brand:end -->
<text x="360.0" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E6E4DC">Trust stays visible</text>
<rect x="20" y="48" width="680" height="214" rx="20" fill="#262623"/>
<text x="40" y="76" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#E6E4DC">Every concept says how far it has been checked</text>
<rect x="44" y="92" width="176" height="96" rx="12" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<g transform="translate(132,116)" stroke="#ABA9A0" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-9" y="-11" width="18" height="22" rx="2"/><line x1="-5" y1="-3" x2="5" y2="-3"/><line x1="-5" y1="2" x2="5" y2="2"/><line x1="-5" y1="7" x2="2" y2="7"/></g>
<text x="132" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E6E4DC">Still a draft</text>
<text x="132" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">the librarian wrote it;</text>
<text x="132" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8F8E86">nobody has checked this yet</text>
<rect x="272" y="92" width="176" height="96" rx="12" fill="#33290F" stroke="#C99A3E" stroke-width="2"/>
<g transform="translate(360,116)" stroke="#E4BD6E" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="-8" y="-8" width="16" height="18" rx="2"/><path d="M-3 -10 h6 v3 h-6 z" fill="#33290F"/><path d="M-4 2 l3 3 l5 -6"/></g>
<text x="360" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#E4BD6E">Checked by automation</text>
<text x="360" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E4BD6E">lokf validate · CI · Registrar</text>
<text x="360" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8F8E86">re-checked the source still matches</text>
<rect x="500" y="92" width="176" height="96" rx="12" fill="#142639" stroke="#5A9BE0" stroke-width="2"/>
<g transform="translate(588,116)" stroke="#93C0F2" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="4"/><path d="M-8 9 a8 8 0 0 1 16 0"/></g>
<text x="588" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#93C0F2">Confirmed by a person</text>
<text x="588" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#93C0F2">a named person read the source</text>
<text x="588" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8F8E86">verified: human:&lt;id&gt; appended</text>
<line x1="226" y1="140" x2="266" y2="140" stroke="#8F8E86" stroke-width="1.3"/><path d="M259.4 144.5 L266 140 L259.4 135.5" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="246.0" y="132.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">tools</text>
<line x1="454" y1="140" x2="494" y2="140" stroke="#8F8E86" stroke-width="1.3"/><path d="M487.4 144.5 L494 140 L487.4 135.5" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><text x="474.0" y="132.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">person</text>
<path d="M588 188 v18 h-456 v-18" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-dasharray="3 3"/>
<path d="M126 194 L132 187 L138 194" fill="none" stroke="#8F8E86" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="360" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#8F8E86">edited since confirmed · past its review date · sent back - and it drops a rung</text>
<text x="40" y="232" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ABA9A0">Also shown:</text>
<rect x="110" y="218" width="60" height="20" rx="10.0" fill="#30302C" stroke="#4A4944" stroke-width="1"/><text x="140.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#ABA9A0">retired</text>
<rect x="178" y="218" width="132" height="20" rx="10.0" fill="#30302C" stroke="#4A4944" stroke-width="1"/><text x="244.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#ABA9A0">edited since confirmed</text>
<rect x="318" y="218" width="118" height="20" rx="10.0" fill="#30302C" stroke="#4A4944" stroke-width="1"/><text x="377.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#ABA9A0">past its review date</text>
<rect x="444" y="218" width="160" height="20" rx="10.0" fill="#30302C" stroke="#4A4944" stroke-width="1"/><text x="524.0" y="232.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#ABA9A0">n other concepts rely on this</text>
<rect x="20" y="274" width="680" height="46" rx="12" fill="#30302C" stroke="#4A4944" stroke-width="1"/>
<text x="40" y="293" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#E6E4DC">The number to watch</text>
<text x="40" y="309" font-family="Arial, sans-serif" font-size="10.5" fill="#8F8E86">computed from the frontmatter on every read, never stored - so it cannot drift</text>
<rect x="418" y="286" width="118" height="22" rx="11.0" fill="#142639" stroke="#5A9BE0" stroke-width="1"/><text x="477.0" y="301.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#93C0F2">Confirmed 12 / 40</text>
<text x="548" y="301" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">meant to rise slowly,</text>
<text x="548" y="313" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">a few concepts a sitting</text>
<circle cx="52" cy="344" r="5" fill="#30302C" stroke="#ABA9A0" stroke-width="1"/>
<text x="63" y="348" font-family="Arial, sans-serif" font-size="12" fill="#ABA9A0">raw / unprocessed</text>
<circle cx="193" cy="344" r="5" fill="#33290F" stroke="#C99A3E" stroke-width="1"/>
<text x="204" y="348" font-family="Arial, sans-serif" font-size="12" fill="#E4BD6E">deterministic tools check it</text>
<circle cx="405" cy="344" r="5" fill="#142639" stroke="#5A9BE0" stroke-width="1"/>
<text x="416" y="348" font-family="Arial, sans-serif" font-size="12" fill="#93C0F2">a named person vouches for it</text>
</svg>
