<svg width="720" height="592" viewBox="0 0 720 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Trust stays visible</title>
<desc id="d">A concept that is not retired stands on one of three rungs, drawn as a ladder. The lowest rung, which OKF calls unverified: nobody has checked this yet, and verified has no event. The middle rung, machine-confirmed: checked by automation only, where verified holds events, none by a human: actor. The top rung, human-reviewed: confirmed by a person, where verified holds an event by a human: actor. Four rules move a concept. One: an event raises it, a check by automation or a person's confirmation, from either lower rung. Two: an edit drops it, and the concept reads edited since a person last confirmed it until a person confirms it again. Three: everything else flags it, so a label is added and the rung stays. Four: a retirement takes it off, and a retired concept does not stand on a rung or carry any other label; it reads retired, replaced by its successor. The number to watch is confirmed by a person, 12 of 40 in the example, computed on every read and never stored. The labels that flag a concept beside its rung: still a draft; reopened; past its review date; due soon; a source moved since the confirmation; a reader disputed this; N other concepts rely on this; doesn't fit the known vocabulary; derived from a concept edited since its confirmation; not tied to a signed commit.</desc>
