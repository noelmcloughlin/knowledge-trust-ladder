<svg width="720" height="526" viewBox="0 0 720 526" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The curator's review session</title>
<desc id="d">One concept, one verb, one person's answer. The report's queue, worth ten minutes today, lists at most five concepts, each in the first group that fits it: one, past its review date, edited since a person last confirmed it, or a source moved since; two, reopened or still a draft, with an open question; three, nobody has checked this yet; four, reopened or still a draft without one, or checked by automation only. Within a group, the concept most relied on comes first. The session takes one concept at a time: the source first, each passage the librarian quoted, where there is one; then the claim, its title, its description and the key facts; then one question, does the source still say this? The session never answers it. The person gives one verb. Confirm, which needs an authenticated id, records a confirmation in your name, and a review date you accept. Wrong, send back, the default, records a draft status and your note, for the librarian's next run. Wrong, correct now, which needs an authenticated id, records your correction, as your own edit and your confirmation. Retire records the concept as retired, and what replaced it. Later records nothing but a draft status or a review date. A session writes one Curation line in the root log.md, and one Deprecation line for each retirement. It never confirms in bulk, and never edits or removes a person's earlier confirmation.</desc>
