<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">The three lines of defence, with each LOKF role in place</title>
  <desc id="d">Above the lines, the governing body: the owners of the repository that holds the bundle, with two instruments, the organisation's rules for AI-assisted work and the curation policy. First line: the librarian, an agent that derives each record from a named source, and the curator, a named person who confirms; the sidecar lays down their tools. Second line: the registrar, a program: lokf validate and the provenance gate; the sidecar lays down the gate. Third line: independent assurance, not shipped; what ships is the evidence a reviewer would need. Outside the lines: the docent and the reader; what the docent cannot answer goes back to the librarian as untrusted feedback. Each card is coloured by who acts: green where an agent derives it, amber where deterministic tools check it, blue where a named person vouches for it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8F8E86"/>
    </marker>
  </defs>
  <rect width="720" height="620" fill="#1C1C1A"/>
<!-- ktl-brand:start --><g transform="translate(20,6) scale(0.46875)"><rect x="17.5" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/><rect x="42" y="12" width="4.5" height="38" rx="2.25" fill="#6E6D66"/><rect x="17.5" y="38" width="29" height="5" rx="2.5" fill="#ABA9A0"/><rect x="17.5" y="28.5" width="29" height="5" rx="2.5" fill="#E4BD6E"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#1C1C1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 16 L29.5 23.5 L49.5 6.5" fill="none" stroke="#93C0F2" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 49.5 C26 45 15 45 6.5 47.5 v9.5 C15 54.5 26 54.5 32 59 C38 54.5 49 54.5 57.5 57 v-9.5 C49 45 38 45 32 49.5 z" fill="#23301B" stroke="#6FA33F" stroke-width="1.7" stroke-linejoin="round"/><line x1="32" y1="49.5" x2="32" y2="59" stroke="#6FA33F" stroke-width="1.7"/><path d="M11 50.6 C16 49.6 22 49.8 27 51.6 M37 51.6 C42 49.8 48 49.6 53 50.6" fill="none" stroke="#6FA33F" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/></g><text x="56" y="19" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ABA9A0">Knowledge</text><text x="56" y="31.5" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#ABA9A0">Trust Ladder</text><!-- ktl-brand:end -->

  <text x="360" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#E6E4DC">The three lines of defence</text>
  <g transform="translate(0,46)">
  <rect x="40" y="16" width="640" height="62" rx="8" fill="#30302C" stroke="#ABA9A0" stroke-width="1.5"/>
  <text x="360" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E6E4DC">Governing body - the owners of the repository that holds the bundle</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ABA9A0">Two instruments: the organisation's rules for AI-assisted work, and the curation policy</text>

  <rect x="40" y="100" width="640" height="104" rx="8" fill="#262623"/>
  <text x="56" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E6E4DC">FIRST LINE</text>
  <text x="56" y="142" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">owns the work</text>
  <text x="56" y="156" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">and its risk</text>
  <text x="56" y="180" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8F8E86">the sidecar lays</text>
  <text x="56" y="194" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8F8E86">down the tools</text>

  <rect x="190" y="112" width="228" height="80" rx="6" fill="#23301B" stroke="#6FA33F" stroke-width="2"/>
  <text x="304" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A9D27C">Librarian (an agent)</text>
  <text x="304" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">derives each record from a source it names</text>
  <text x="304" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">re-checks as process:, never as a person</text>
  <text x="304" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">what it cannot settle: status: draft</text>

  <line x1="418" y1="152" x2="446" y2="152" stroke="#8F8E86" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="448" y="112" width="216" height="80" rx="6" fill="#142639" stroke="#5A9BE0" stroke-width="2"/>
  <text x="556" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A9D27C">Curator (a named person)</text>
  <text x="556" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">confirm, correct, send back, retire, later</text>
  <text x="556" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">source first, then claim, then verdict</text>
  <text x="556" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#A9D27C">identity from GitHub (gh api user)</text>

  <line x1="360" y1="204" x2="360" y2="232" stroke="#8F8E86" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="222" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">a pull request carrying the change and its human: verdicts</text>

  <rect x="40" y="236" width="640" height="104" rx="8" fill="#262623"/>
  <text x="56" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E6E4DC">SECOND LINE</text>
  <text x="56" y="278" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">keeps the rules,</text>
  <text x="56" y="292" font-family="Arial, sans-serif" font-size="11" fill="#ABA9A0">judges no truth</text>
  <text x="56" y="316" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8F8E86">the sidecar lays</text>
  <text x="56" y="330" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8F8E86">down the gate</text>

  <rect x="190" y="248" width="474" height="80" rx="6" fill="#33290F" stroke="#C99A3E" stroke-width="2"/>
  <text x="427" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E4BD6E">Registrar (a program)</text>
  <text x="427" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E4BD6E">lokf validate on every change, and again as the CI gate: every record well-formed</text>
  <text x="427" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E4BD6E">provenance gate: a human: verdict needs that person's own approval or signature</text>

  <line x1="360" y1="340" x2="360" y2="368" stroke="#8F8E86" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="358" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">the evidence, written where an auditor can find it</text>

  <rect x="40" y="372" width="640" height="72" rx="8" fill="#30302C" stroke="#8F8E86" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="396" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8F8E86">THIRD LINE</text>
  <text x="56" y="414" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">independent assurance</text>
  <text x="56" y="428" font-family="Arial, sans-serif" font-size="11" fill="#8F8E86">not shipped</text>
  <text x="427" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E6E4DC">Review by someone other than the authors. What ships is what they would need:</text>
  <text x="427" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E6E4DC">resource · generated · verified · stale_after · provenance log · log.md · git</text>
  <text x="427" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E6E4DC">every trust label computed from these on each read, never stored</text>

  <rect x="40" y="468" width="640" height="52" rx="8" fill="#30302C" stroke="#8F8E86" stroke-width="1.5"/>
  <text x="56" y="490" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E6E4DC">OUTSIDE THE LINES</text>
  <text x="56" y="508" font-family="Arial, sans-serif" font-size="11" fill="#E6E4DC">the docent and the reader</text>
  <text x="427" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E6E4DC">Docent: answers from the bundle, each concept with its trust label</text>
  <text x="427" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#E6E4DC">what it cannot answer goes back to the librarian as untrusted feedback</text>

  <path d="M 30 494 L 20 494 L 20 152 L 34 152" fill="none" stroke="#8F8E86" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  </g>
  <circle cx="52" cy="604" r="5" fill="#23301B" stroke="#6FA33F" stroke-width="1"/><text x="63" y="608" font-family="Arial, sans-serif" font-size="12" fill="#A9D27C">an agent derives it</text>
  <circle cx="206" cy="604" r="5" fill="#33290F" stroke="#C99A3E" stroke-width="1"/><text x="217" y="608" font-family="Arial, sans-serif" font-size="12" fill="#E4BD6E">deterministic tools check it</text>
  <circle cx="418" cy="604" r="5" fill="#142639" stroke="#5A9BE0" stroke-width="1"/><text x="429" y="608" font-family="Arial, sans-serif" font-size="12" fill="#93C0F2">a named person vouches for it</text>
  
</svg>
