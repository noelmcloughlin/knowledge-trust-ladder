<svg width="720" height="582" viewBox="0 0 720 582" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Knowledge outside the repository</title>
<desc id="d">A copy comes in, is reviewed, and is cited like any tracked file. Outside the repository there are four kinds of source: confluence, Confluence pages chosen by label, space, page, tree or CQL; http, pages and documents as HTML, Markdown, text or PDF; git, another repository, a path at a ref, or a wiki; and command, a command's output from a client, a dump or an export. The ingest: the manifest .lokf/ingest.yaml gives each source's place, selector, owner and reason, and does not hold a token. The script knowledge-ingest.sh fetches what moved and converts each page to Markdown, in a read-only job that holds the secrets and does not run an agent. It writes .lokf/mirror/&lt;entry id&gt;/, one Markdown file per page or document with its origin, version and digest, and .lokf/ingest.lock.yaml, which gives each item a state: ok, gone, unlisted, failed, refused or skipped. The review: one pull request, opened by the Sunday run and refreshed until a person merges it, in which the diff is the page. On Monday the librarian's work list names each concept whose mirror file moved. A concept cites both: resource is the mirror file, and sources is the origin page; it is agent-derived until confirmed. Nothing fetched is knowledge yet. The job that holds the secrets has no write token, and the job that writes has no secret. The scheduled librarian reads a mirror file only after a person merges it. A confidential entry is never committed.</desc>
