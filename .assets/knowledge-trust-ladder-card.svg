<svg width="720" height="484" viewBox="0 0 720 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Knowledge Trust Ladder</title>
<desc id="d">The Knowledge Trust Ladder mark: a ladder rising out of an open book, its top rung a check mark. Top: raw sources in the repository produce a LOKF knowledge bundle at .lokf/knowledge/, one Markdown note per concept. Bottom: five roles in the order they first run, left to right: Sidecar lays the network, Librarian binds it into order, Registrar keeps records straight (not a skill: lokf validate, CI, and the Obsidian plugin), Curator holds the scales and is always a person, Docent guides the visitors. A dashed feedback path returns from the Docent and the Curator to the Librarian: what a curator sends back or a reader finds missing becomes the librarian's next task. Green marks agent work, amber deterministic checks, blue a named person.</desc>
<rect width="720" height="484" fill="#E4E1D7"/>
