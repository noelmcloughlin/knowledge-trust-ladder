<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Knowledge Trust Ladder</title>
<desc id="d">Raw sources in a repository, its code, notes and documents, become a knowledge bundle: .lokf/knowledge/, one Markdown file per concept, linked. Five roles keep a bundle, drawn as five index cards. The sidecar, the skill ktl-sidecar, lays the network, once. The librarian, the skill ktl-librarian, binds it into order, often. The registrar keeps the records in order on every change; programs play it: the lokf toolkit, scripts and a gate in CI. The curator, a named person helped by ktl-curator, holds the scales, a little and regularly. The docent, the skill ktl-docent, guides the visitors whenever anyone asks, and is read-only on the bundle. What the curator sends back, and what a reader missed or disputed, is the librarian's next task. Two optional skills work beside the roles: ktl-prose rewords what the librarian wrote, and ktl-website publishes the bundle. The key: grey for raw sources, green for what an agent derives, amber for what deterministic tools check, blue for what a named person vouches for.</desc>
