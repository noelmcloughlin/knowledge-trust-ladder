<svg width="720" height="712" viewBox="0 0 720 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How the workspace stays current</title>
<desc id="d">How the workspace stays current. A release of the top domain starts the build. A member releases, and its new release does not change the workspace yet. A person confirms the member concept that names the new release. Then the domain releases: on GitHub, the host's release starts the job. The build, knowledge-federate.py build, is a script, and does not run an agent. One, resolve: it takes the members, as a person last confirmed them. Two, verify: it fetches each file, and checks its checksum and its attestation. Three, register and export: each bundle, with the lokf toolkit. Four, load: one named graph per bundle, named by its base_iri. Five, gate: every link between bundles, against the registry. Six, swap: the new workspace replaces the old, by two renames. A file that fails a check stops the job, and the old workspace stays. The workspace holds index.md, the index that is read first; workspace.lock.yaml, each release; graph.nq, one named graph per bundle; bundles/&lt;slug&gt;/, each bundle as released; queries/labels.rq, the trust labels; and gate-report.md, the links across bundles. Pre-built is not pre-loaded. knowledge-federate.py mcp, serve and query read the workspace in place: the index first, then a walk on demand. The MCP server loads a member's graph when a walk first reaches its namespace, and queries/labels.rq computes each trust label when the query runs. The readers, agents, copilots and the people who ask them, read over MCP or SPARQL.</desc>
