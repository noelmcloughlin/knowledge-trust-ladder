<svg width="720" height="564" viewBox="0 0 720 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">How the context workspace stays current</title>
<desc id="d">Top panel: the artifact repository holds versioned releases of bundles today, and of schemas and manifests later; a publish event starts the refresh job, which resolves, verifies, builds and swaps, runs no agent, and keeps the old snapshot when a check fails. Bottom panel, inside the workspace: a manifest and lock, whose scope a named person confirms, names each release and its checksum; the bundle files, Markdown and schemas, are fetched and verified and kept read-only as released; the knowledge graph, one named graph per bundle named by its base_iri and loaded from the graph.nt that lokf export writes, is built from them and swapped in. A read interface serves the files and the graph - index first, then traverse on demand, with trust labels computed on every read - as a SPARQL endpoint and an MCP server over the store; lokf serve, query and mcp do this for one bundle today. Below, readers - agents, copilots and the people who ask them - query it over MCP or SPARQL, and every answer says how far it has been checked. The refresh job, the manifest and lock, and the knowledge graph shipped on 2026-10-16 as knowledge-federate.py and knowledge-federation.yaml in the sidecar's templates.</desc>
