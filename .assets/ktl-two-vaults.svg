<svg width="720" height="452" viewBox="0 0 720 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="'Atkinson Hyperlegible Next', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where it meets an Obsidian vault</title>
<desc id="d">Two vaults, one folder, no shared index. The workshop is your vault, or a repository: my-vault/ holds notes/, projects/ and daily/, its own .obsidian/, and the sidecar .lokf/, whose knowledge/ folder is the bundle. Beside .lokf/ sits knowledge_bundle, a link to .lokf/knowledge: the doorway, a name that a folder picker can see. The workshop is yours, and nothing in it is moved or migrated. File, Open folder as vault, with the doorway picked, opens the exhibition: the bundle, opened as a vault of its own. Its index.md carries the bundle's header; it holds folders such as services/ and playbooks/, log.md, and an .obsidian/ of its own that git ignores. Plugins are installed in this vault. KTL Registrar shows LOKF and a check mark, and checks each record as it is typed. KTL Curator shows Confirmed 12/40, and runs the review session without an agent. Skills fill it from a terminal or CI. The key: grey for raw sources, green for what an agent derives, amber for what deterministic tools check, blue for what a named person vouches for.</desc>
