<svg width="720" height="540" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Who writes the bundle, and what checks it</title>
<desc id="d">Three writers, each through one door. The librarian, an agent, writes only .lokf/patch.yaml, which the pen, knowledge-apply.sh, applies to the bundle and refuses when it names a human: actor. The curator, a named person, writes a verified event in that person's name through ktl-curator or the KTL Curator plugin. The docent, an agent, writes nothing in the bundle; knowledge-feedback.sh records a reader's miss in feedback.md, and the pen files each handled entry in questions.md. Below, two programs check what lands: the registrar's gate, knowledge-registrar.yaml, runs lokf validate, the conventions script and the provenance job on each pull request, and a human: event needs that person's approval or signature; knowledge-report.sh computes each trust label, the health line and the librarian's work list on every read.</desc>
<rect width="720" height="540" fill="#E4E1D7"/>
