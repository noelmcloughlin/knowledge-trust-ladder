<text x="80" y="114" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#2C2C2A">Workshop</text>
<text x="150" y="114" font-family="Arial, sans-serif" font-size="10.5" fill="#6E6D66">your vault, or a repository</text>
<text x="58" y="140" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#2C2C2A">my-vault/</text>
<text x="72" y="156" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">notes/  projects/  daily/</text>
<text x="72" y="172" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">.obsidian/</text>
