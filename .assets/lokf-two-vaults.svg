<text x="72" y="222" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5F5E5A">knowledge_bundle  ->  .lokf/knowledge</text>
<text x="220" y="204" font-family="Arial, sans-serif" font-size="10" fill="#27500A">the exhibition</text>
<text x="58" y="292" font-family="Arial, sans-serif" font-size="10.5" font-style="italic" fill="#5F5E5A">The workshop is yours.</text>
