<svg width="720" height="368" viewBox="0 0 720 368" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Where it meets an Obsidian vault</title>
<desc id="d">Left, the workshop: a vault or repository tree with notes, .obsidian/, and a .lokf/knowledge/ sidecar plus a knowledge_bundle link pointing at it; Obsidian lists neither. An arrow labelled File, Open folder as vault leads right to the exhibition: the same folder opened as its own small vault, with index.md carrying the LOKF header, and the two plugins installed there: LOKF Registrar showing LOKF check in the status bar, LOKF Curator showing Confirmed 12 of 40. The curated knowledge bundle.</desc>
<rect width="720" height="368" fill="#E4E1D7"/>
