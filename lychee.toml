# lychee link-checker config (validate.yml's "Check links" step, and local
# ad-hoc runs, pick this up automatically).

# A failed request is retried with a wait that grows each time, so a
# host that answers a burst with 503 (github.com, below) has time to
# recover before the link is declared dead.
max_retries = 3
retry_wait_time = 5

exclude = [
  # LOKF's published JSON-LD context. Every LOKF bundle's index.md declares
  # this exact URI (see skills/ktl-sidecar/templates/knowledge/index.md
  # and ktl-librarian/SKILL.md Golden Rule 2). It is the upstream lokf
  # project's identifier, not this repository's, and currently answers 404
  # (checked 2026-09-08). Re-check periodically and drop this line once the
  # w3id.org redirect is registered.
  '^https://w3id\.org/lokf/context\.jsonld$',
  # Publisher DOI resolvers (Wiley, ACM, SAGE, Elsevier) and parliament.uk
  # answer automated clients with 403 while serving the same pages to a
  # browser; docs/three-lines.md cites them and each was opened
  # and read by hand on 2026-09-16. A DOI is a persistent identifier, so
  # re-check these by hand on the bundle's refresh, not here.
  '^https://doi\.org/',
  '^https://www\.parliament\.uk/',
  # bis.org answers automated clients with 403, even with a browser's user
  # agent; the Internet Archive serves the same PDF (checked 2026-10-22).
  '^https://www\.bis\.org/',
  # conventionalcommits.org (Netlify) answers CI runners with 503 on every
  # retry while serving 200 elsewhere; not a dead link. Drop this exclusion
  # if CI reaches it again.
  '^https://www\.conventionalcommits\.org/',
  # graphdb.ontotext.com (cited in docs/context-layer-technology.md) and
  # dyslexia.ie (cited in ktl-prose's references/young-readers.md) time out
  # for CI runners while serving 200 elsewhere within a second (checked
  # 2026-10-12). Drop these lines if CI reaches them again.
  '^https://graphdb\.ontotext\.com/',
  '^https://dyslexia\.ie/',
  # docs.snowflake.com (cited in docs/context-layer-technology.md) answered
  # a CI runner with 503 for one of its pages while the other pages it cites
  # passed, and serves that page with 200 elsewhere (checked 2026-10-13).
  # The whole host is excluded, since any of its pages can be next. Drop
  # this line if CI reaches it again.
  '^https://docs\.snowflake\.com/',
  # A GitHub issue or pull request page answered a CI runner with 500 past
  # every retry, while the issue was open and the page served 200 elsewhere
  # (checked 2026-10-14). The next step in validate.yml checks each such
  # link through GitHub's API with the job's own token instead, so a deleted
  # or moved issue still fails and a page GitHub fails to render does not.
  '^https://github\.com/[^/]+/[^/]+/(issues|pull)/[0-9]+',
]

# knowledge_bundle is a symlink to .lokf/knowledge (the Obsidian vault entry
# point, see ktl-sidecar Step 2). Exclude it so lychee does not walk the
# same files twice, once at each path.
exclude_path = [
  "(^|/)knowledge_bundle/",
  # The site's build writes these from the repository's own Markdown, with
  # links that only resolve once the site is served. website/'s own link check
  # covers them, and the files they come from are checked where they are.
  "(^|/)website/(dist|public|src/content|src/generated|node_modules)/",
]

# github.com answers automated clients with 503 or 429 on a file page
# (/blob/) while it serves the repository pages. On 2026-10-12 it did so
# to a CI runner and a workstation alike, past every retry above. The raw
# host, raw.githubusercontent.com, serves the same file at the same
# commit, tag or branch, and answers 404 once the file is gone, so lychee
# checks each file link there instead. An exclusion for a file link must
# name its raw address, since lychee remaps a link before it applies
# `exclude`.
remap = [
  '^https://github\.com/([^/]+/[^/]+)/blob/([^?#]+)([?#].*)?$ https://raw.githubusercontent.com/$1/$2',
]

# The rest of github.com, such as repository, folder and issue pages, also
# answers a burst of requests from one CI runner with 503. Pace the
# requests to it rather than exclude it, so a moved or deleted page still
# fails.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
