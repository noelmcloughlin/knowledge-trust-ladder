name: Knowledge federation

# Builds the workspace of a domain host: the graph of every bundle the
# domain's member concepts name, one named graph per bundle, from their
# released zips. .lokf/scripts/knowledge-federate.py does the work (resolve
# a lock, fetch and verify each zip, register and export each bundle with
# the lokf toolkit, load, gate the links that cross bundles, swap), and this
# workflow runs it, publishes the result, and keeps the site current. It
# runs no LLM or agent, and it never commits or pushes.
#
# Four jobs, each for one event, each with the least it needs:
#
#   check     a pull request that changes the domain bundle: fetch and verify
#             each zip its member concepts name, export and load them, and run
#             the gate as the next release build would, writing nothing. So a
#             link into a namespace no member owns, or into a member no
#             person has confirmed, fails the pull request, not the release
#             build after the merge. GitHub starts no workflow for a pull request the
#             librarian's job token opened, so there this job first runs when
#             a person pushes to it, as the curator's confirmation commit does.
#
#   build     a release of this repository, or a dispatch naming one: build
#             the workspace from the tag, build the website when there is
#             one, and hand both to `publish` as artifacts. A push to the
#             default branch rebuilds the website alone and reuses the newest
#             released workspace, so the site is current and the workspace
#             still reflects a confirmed domain.
#
#   publish   the privileged half: checks each zip against its checksum,
#             attests it, uploads it to the release, and deploys the Pages
#             artifact. This workflow is the host's one Pages deployer, so a
#             domain host leaves KNOWLEDGE_WEBSITE_ENABLED unset.
#
#   nudge     weekly: dispatches the librarian workflow, because a bundle
#             whose sources are release URLs is always quiet to the schedule,
#             and the domain's librarian is a script that must run anyway.
#
# Inert until the repository variable KNOWLEDGE_FEDERATION_ENABLED is
# "true" (Repository variables, not an environment's), except for a run a
# person starts by hand. A release made with GITHUB_TOKEN starts no
# workflow, so the host's release job dispatches this one:
#   gh workflow run knowledge-federation.yaml --ref "$TAG" -f tag="$TAG"
# Before the first deployment, tell Pages once to take its site from
# Actions: gh api -X POST repos/{owner}/{repo}/pages -f build_type=workflow
on:
  release:
    types: [published]
  push:
    branches: [main]
  # The gate reads every concept of the domain bundle, not only its members,
  # and the toolkit that uv.lock pins exports what the gate reads.
  pull_request:
    paths:
      - ".lokf/knowledge/**"
      - ".lokf/domain.yaml"
      - ".lokf/pyproject.toml"
      - ".lokf/uv.lock"
      - ".lokf/scripts/knowledge-federate.py"
      - ".github/workflows/knowledge-federation.yaml"
  schedule:
    - cron: "41 5 * * 1" # Mondays at 05:41 UTC, after the librarian's own slot
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to build the workspace from, e.g. v0.2.0"
        required: true
        type: string

permissions: {} # deny by default; each job requests only the scopes it needs

concurrency:
  group: knowledge-federation-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Verify the members and gate the links a pull request proposes (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The whole history: the check reads which members the next release
      # build would take, from each member concept's first-parent history,
      # as that build does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .lokf/uv.lock

      - name: Install the lokf toolkit the sidecar pins
        run: uv sync --locked
        working-directory: .lokf

      # The token is read-only and reaches one command, gh attestation
      # verify, which reads the attestation store; the zips come from the
      # public release URLs the member concepts name.
      - name: Fetch and verify every member's zip, and gate as the next release would
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project .lokf .lokf/scripts/knowledge-federate.py build --verify-only

  build:
    name: Build the workspace and the site (read-only)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (vars.KNOWLEDGE_FEDERATION_ENABLED == 'true'
          && (github.event_name == 'release'
              || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.what.outputs.tag }}
      release: ${{ steps.what.outputs.release }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # A release builds from its tag; a push builds the site from the branch.
      - name: Say what this run does
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            gh release view "$TAG" --json tagName --jq .tagName >/dev/null \
              || { echo "::error::No release exists for tag $TAG. Create the release first, then run this workflow again."; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            echo "A release: the workspace is built from $TAG and attached to it."
          else
            echo "tag=" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            echo "A push: the site is rebuilt and the newest released workspace reused."
          fi

      # The whole history: the health lines in the workspace's index and on
      # the site come from git, as knowledge-report.sh computes them anywhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG && format('refs/tags/{0}', env.TAG) || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: .lokf/uv.lock
          prune-cache: true

      - name: Install the lokf toolkit the sidecar pins
        run: uv sync --locked
        working-directory: .lokf

      - name: Use Node.js, when the host has a website
        if: hashFiles('website/package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The same two commands the website workflow runs; this workflow
      # deploys in its place on a domain host.
      - name: Build the site, when the host has one
        if: hashFiles('website/package-lock.json') != ''
        working-directory: website
        run: |
          npm ci
          npm run build

      # The token is read-only and reaches one command, gh attestation
      # verify. Everything the build downloads is a file a member concept
      # names, checked against the checksum a person confirmed, or a zip
      # that a member domain's released lock names, checked against the
      # checksum in that lock.
      - name: Build the workspace from the tag
        if: steps.what.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project .lokf .lokf/scripts/knowledge-federate.py build \
            --tag "$TAG" --release-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag"

      # The same bundle of files always gives the same bytes: names sorted,
      # modes fixed, every file at the time of the tag's commit, no uid, gid
      # or extended-time fields, the one kept time in UTC.
      - name: Pack the workspace
        if: steps.what.outputs.release == 'true'
        run: |
          set -euo pipefail
          asset="workspace-${TAG//\//-}.zip"
          mtime="$(git log -1 --format=%ct "refs/tags/$TAG")"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" "$RUNNER_TEMP/release"
          cp -R -P snapshot "$stage/workspace"
          chmod -R u=rwX,go=rX "$stage/workspace"
          find "$stage/workspace" -exec touch -h -d "@$mtime" {} +
          (cd "$stage" && find workspace \( -type f -o -type l \) -print | LC_ALL=C sort | TZ=UTC zip -q -X -y -@ "$RUNNER_TEMP/release/$asset")
          (cd "$RUNNER_TEMP/release" && sha256sum "$asset" > "$asset.sha256")
          echo "Packed $(unzip -Z1 "$RUNNER_TEMP/release/$asset" | wc -l) files into $asset"

      # A push carries no new workspace: the newest released one is served
      # again, so the site never shows a workspace no person confirmed.
      - name: Take the newest released workspace
        if: steps.what.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name | startswith("workspace-") and endswith(".zip"))) | .tag_name' | sed -n 1p || true)"
          if [ -z "$tag" ]; then
            echo "::notice::No release carries a workspace yet, so the site is deployed without one."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/released"
          gh release download "$tag" --pattern 'workspace-*.zip' --pattern 'workspace-*.zip.sha256' --dir "$RUNNER_TEMP/released"
          (cd "$RUNNER_TEMP/released" && sha256sum -c -- *.sha256 && unzip -q workspace-*.zip)
          mv "$RUNNER_TEMP/released/workspace" snapshot
          echo "Reusing the workspace released with $tag."

      # The Pages artifact: the site with the workspace under /workspace/, or
      # the workspace alone on a host with no site.
      - name: Assemble the Pages artifact
        run: |
          set -euo pipefail
          if [ -d website/dist ]; then dist=website/dist; else mkdir -p dist; dist=dist; fi
          if [ -d snapshot ]; then
            rm -rf "$dist/workspace"
            cp -R snapshot "$dist/workspace"
            chmod -R u+rwX "$dist/workspace"
          fi
          echo "dist=$dist" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.dist }}

      - name: Upload the workspace zip
        if: steps.what.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-federation
          path: ${{ runner.temp }}/release/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Attach the workspace to the release and deploy the site (privileged)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the attestation and deploy Pages
      attestations: write # store the attestation
      pages: write # deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download the workspace zip
        if: needs.build.outputs.release == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knowledge-federation
          path: ${{ runner.temp }}/release

      - name: Check the zip against its checksum
        if: needs.build.outputs.release == 'true'
        run: sha256sum -c -- *.sha256
        working-directory: ${{ runner.temp }}/release

      # A signed record of which workflow run, commit and repository built the
      # zip; anyone checks it with `gh attestation verify <file> -R <owner>/<repo>`.
      - name: Attest build provenance
        if: needs.build.outputs.release == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*.zip

      - name: Upload to the release
        if: needs.build.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" ./*.zip ./*.sha256 --clobber
        working-directory: ${{ runner.temp }}/release

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  nudge:
    name: Dispatch the librarian, whose schedule finds this bundle quiet
    if: github.event_name == 'schedule' && vars.KNOWLEDGE_FEDERATION_ENABLED == 'true' && vars.KNOWLEDGE_LIBRARIAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write # start knowledge-librarian.yaml
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # A run a person starts skips the quiet check, so the members script
      # runs and proposes any member that moved. The librarian workflow
      # itself still opens one pull request at most and never merges.
      - name: Start the librarian
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run knowledge-librarian.yaml
