name: Knowledge sync

# Keeps this host's sidecar copies and skills pin at the newest release of
# Knowledge Trust Ladder, the repository that publishes the skills. Each day
# it reads the pin in knowledge-librarian.yaml and the newest release there.
# When the pin is behind, it runs the host's own copy of
# .lokf/scripts/knowledge-sync.sh. That script copies the release's templates
# over the host's copies, moves the pin, writes the changelog entry and runs
# the sidecar's checks. Then this workflow opens one pull request with the
# diff. It runs no LLM or agent. It never pushes to the default branch and
# never merges.
#
# A run a person starts from the Actions tab may name a release tag. Without
# one it takes the newest release, as a scheduled run does.
#
# A scheduled run also reads what became of the pull requests this workflow
# opened before. While one is still open it opens no second one beside it.
# And a tag whose pull request a person closed without merging is not
# proposed again. A run a person starts goes ahead in both cases, apart from
# a tag whose pull request is still open: close that one first.
#
# Three jobs, for least privilege. `earlier` reads the pin, the release and
# the earlier pull requests under a token that can read the repository and
# its pull requests, and nothing else. `sync` runs the sync script, which
# clones the release and runs the copy of itself in that clone, under a
# read-only token with no git credentials on disk, and hands the change to
# `publish` as a patch artifact. `publish` runs no code from the release. It
# checks that the patch touches only the files a sync may touch, that the
# pin names the commit the tag names at the skills repository, applies the
# patch on a clean checkout, and opens the pull request.
#
# The pull request changes files under .github/workflows/, which the job's
# own GITHUB_TOKEN may not push. So `publish` pushes and opens the pull
# request with the KNOWLEDGE_SYNC_TOKEN repository secret. That is a
# fine-grained personal access token for this repository alone, with
# Contents, Pull requests and Workflows set to read and write, or a GitHub
# App's installation token made in a step of your own. A pull request opened
# with it starts this repository's checks, as one opened with GITHUB_TOKEN
# would not. Without the secret the workflow still runs: it attaches the
# patch to the run, writes the summary, and opens nothing.
#
# The release's own sync script runs in `sync`, before any person here has
# read that release. It runs with no credential, and `publish` applies only
# what the path check allows, so the most it can do is propose a change to
# the copies, which is what a sync is. The person who reviews the pull
# request reads that change, as they would after running the script by hand.
# The sidecar's references/automation.md says how to set the token up.
on:
  schedule:
    - cron: "10 4 * * *" # daily at 04:10 UTC, so a Monday librarian runs on a current pin
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag of Knowledge Trust Ladder to sync to, such as v0.47.0; empty for the newest release"
        required: false
        type: string

permissions: {} # deny by default; each job requests only the scopes it needs

concurrency:
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  earlier:
    name: Read the pin, the newest release and the earlier pull requests (read-only)
    # The repository that publishes the skills has nothing to sync to.
    # Repository identity is the switch, not a file in the tree, as in the
    # librarian workflow's install step. A fork that develops the skills
    # changes the name in both places.
    if: github.repository != 'noelmcloughlin/knowledge-trust-ladder'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the pin out of the librarian workflow
      pull-requests: read # list this workflow's pull requests
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      from: ${{ steps.read.outputs.from }}
      repo: ${{ steps.read.outputs.repo }}
      open: ${{ steps.read.outputs.open }}
      declined: ${{ steps.read.outputs.declined }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pin and the address of the skills repository come from the
      # librarian workflow's copy here, so there is one place to move them.
      # The newest release is what that repository's API calls its latest:
      # published, not a draft and not a pre-release. A pull request this
      # workflow opened comes from a branch of this repository named
      # sync-<tag>; only a branch of this repository counts, since anyone can
      # open a pull request from a fork's branch of the same name.
      - name: Read the pin, the newest release and the earlier pull requests
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          wf=.github/workflows/knowledge-librarian.yaml
          repo=""; pin=""
          if [ -f "$wf" ]; then
            repo="$(grep -oE 'TRUST_LADDER_SKILLS_REPO: *[^ ]+' "$wf" | head -n 1 | sed -E 's/^TRUST_LADDER_SKILLS_REPO: *//' || true)"
            pin="$(grep -oE 'TRUST_LADDER_SKILLS_REF: v[0-9]+\.[0-9]+\.[0-9]+' "$wf" | head -n 1 | sed 's/^TRUST_LADDER_SKILLS_REF: //' || true)"
          fi
          [ -n "$repo" ] || repo="https://github.com/noelmcloughlin/knowledge-trust-ladder"
          slug="${repo#https://github.com/}"; slug="${slug%.git}"; slug="${slug%/}"
          if [ -n "$WANTED" ]; then
            if ! printf '%s\n' "$WANTED" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$WANTED' is not a release tag (vMAJOR.MINOR.PATCH)."
              exit 1
            fi
            tag="$WANTED"
          else
            tag="$(gh api "repos/$slug/releases/latest" --jq .tag_name)"
            if ! printf '%s\n' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::The newest release of $slug is '$tag', which is not a release tag this workflow can sync to."
              exit 1
            fi
          fi
          if [ -z "$WANTED" ] && [ -n "$pin" ] && [ "$(printf '%s\n%s\n' "$pin" "$tag" | sort -V | tail -n 1)" = "$pin" ]; then
            echo "::notice::The pin is at $pin and the newest release is $tag, so there is nothing to sync."
            tag=""
          fi
          # The hundred newest pull requests, newest first, one line each:
          # number, state, merged or not, its branch and that branch's
          # repository. A title, body or comment is never read.
          mine="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&sort=created&direction=desc&per_page=100" \
            --jq '.[] | [.number, .state, (.merged_at != null), .head.ref, (.head.repo.full_name // "-")] | @tsv' \
            | awk -F'\t' -v repo="$GITHUB_REPOSITORY" '$1 ~ /^[0-9]+$/ && $4 ~ /^sync-v[0-9]+\.[0-9]+\.[0-9]+$/ && $5 == repo')"
          open="$(printf '%s\n' "$mine" | awk -F'\t' '$2 == "open" { print $1; exit }')"
          open_branch="$(printf '%s\n' "$mine" | awk -F'\t' '$2 == "open" { print $4; exit }')"
          declined="$(printf '%s\n' "$mine" | awk -F'\t' -v b="sync-$tag" '$2 == "closed" && $3 == "false" && $4 == b { print $1; exit }')"
          if [ -n "$tag" ] && [ -n "$open" ]; then
            if [ "$open_branch" = "sync-$tag" ]; then
              echo "::notice::Pull request #$open from this workflow already proposes $tag and is still open, so this run stops here."
              tag=""
            elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::Pull request #$open from this workflow is still open. A scheduled run opens no second one beside it, so it stops here. A run a person starts goes ahead."
              tag=""
            fi
          fi
          if [ -n "$tag" ] && [ -n "$declined" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::notice::A person closed pull request #$declined, which proposed $tag, without merging. A scheduled run proposes it no more. A run a person starts takes it up again."
            tag=""
          fi
          {
            echo "tag=$tag"
            echo "from=$pin"
            echo "repo=$repo"
            echo "open=$open"
            echo "declined=$declined"
          } >> "$GITHUB_OUTPUT"
          [ -z "$tag" ] || echo "Syncing to $tag, from ${pin:-no pin}."

  sync:
    name: Sync the copies and the pin (read-only)
    needs: earlier
    if: needs.earlier.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repository only; no write token near the release's code
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # The full history, since the sidecar's conventions read each
      # concept's commits, as the gate does.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # keep GITHUB_TOKEN off disk while the release's script runs

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      # The host's copy of the script clones the release and hands over to
      # the copy of itself there, so a template the release added is known.
      # Exit 1 means a check failed on the synced copies: the change is
      # still proposed, and the pull request says how each check ended.
      # Exit 2 means the tag could not be used, which fails the run.
      - name: Run the sync script
        id: run
        env:
          TAG: ${{ needs.earlier.outputs.tag }}
        run: |
          set -euo pipefail
          script=.lokf/scripts/knowledge-sync.sh
          if [ ! -f "$script" ]; then
            echo "::error::No $script here. ktl-sidecar's Step 5 installs it beside this workflow."
            exit 1
          fi
          rc=0
          bash "$script" --changed "$RUNNER_TEMP/changed.txt" --report "$RUNNER_TEMP/report.md" "$TAG" || rc=$?
          if [ "$rc" -ge 2 ]; then exit "$rc"; fi
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "## Knowledge sync to $TAG"; echo; cat "$RUNNER_TEMP/report.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The copies and the pin match $TAG already, so there is nothing to sync."
          fi

      # Hand the change to the privileged job as a patch: the files the
      # script changed or added, by name, and nothing else.
      - name: Package the change
        if: steps.run.outputs.changed == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done < "$RUNNER_TEMP/changed.txt"
          git diff --cached --binary > "$RUNNER_TEMP/sync.patch"

      - name: Upload the patch
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knowledge-sync-patch
          path: |
            ${{ runner.temp }}/sync.patch
            ${{ runner.temp }}/report.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Open the review pull request (privileged, no code from the release)
    needs: [earlier, sync]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the push and the pull request use the sync token, not this one
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: knowledge-sync-patch
          path: ${{ runner.temp }}

      # Trust nothing the `sync` job decided on its own: it ran the release's
      # script. A sync touches the sidecar's copies, the site's copies, the
      # pin and the changelog, and nothing else, so any other path refuses
      # the patch before it touches disk. The three site files a host owns
      # are refused by name. Then the pin is checked against the skills
      # repository itself: the tag must name the commit beside it.
      - name: Check the patch and apply it
        env:
          TAG: ${{ needs.earlier.outputs.tag }}
          REPO: ${{ needs.earlier.outputs.repo }}
        run: |
          set -euo pipefail
          paths="$(git -c core.quotePath=false apply --numstat "$RUNNER_TEMP/sync.patch" | cut -f3-)"
          bad="$(printf '%s\n' "$paths" | grep -Ev '^(\.github/workflows/knowledge-[a-z]+\.yaml|\.github/PULL_REQUEST_TEMPLATE/knowledge-[a-z]+\.md|\.lokf/scripts/knowledge-[a-z]+\.(sh|py)|\.lokf/m365/[A-Za-z0-9._-]+|\.lokf/domain\.yaml|\.lokf/\.gitattributes|\.lokf/justfile|website/.+|CHANGELOG\.md)$' || true)"
          owned="$(printf '%s\n' "$paths" | grep -E '^website/(site\.config\.mjs|README\.md|src/styles/custom\.css)$' || true)"
          if [ -n "${bad//[$'\n\t ']/}" ] || [ -n "${owned//[$'\n\t ']/}" ]; then
            echo "::error::The patch touches paths a sync may not:"
            printf '%s\n%s\n' "$bad" "$owned" | sed '/^$/d; s/^/  /'
            exit 1
          fi
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/sync.patch"
          wf=.github/workflows/knowledge-librarian.yaml
          if [ -f "$wf" ]; then
            ref="$(grep -oE 'TRUST_LADDER_SKILLS_REF: v[0-9]+\.[0-9]+\.[0-9]+' "$wf" | head -n 1 | sed 's/^TRUST_LADDER_SKILLS_REF: //')"
            sha="$(grep -oE 'TRUST_LADDER_SKILLS_SHA: [0-9a-f]{40}' "$wf" | head -n 1 | sed 's/^TRUST_LADDER_SKILLS_SHA: //')"
            if [ "$ref" != "$TAG" ]; then
              echo "::error::The patch pins $ref, and this run syncs to $TAG."
              exit 1
            fi
            # An annotated tag lists its commit on a second, peeled line.
            got="$(git ls-remote --tags "$REPO" "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f1)"
            if [ "$got" != "$sha" ]; then
              echo "::error::$TAG names commit $got at $REPO, and the patch pins $sha."
              exit 1
            fi
          fi

      # The body is the sync's report, then the pull request template the
      # host carries, whose checklist is the reviewer's. The commit is made
      # under a bot identity, which the AI covenant asks of a repository's
      # own automation, and carries no trailer. The push and the pull
      # request use the sync token (see the header). Without it the run
      # ends here, green, with the patch attached and the summary written.
      - name: Commit, push and open the pull request
        env:
          SYNC_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_TOKEN }}
          TAG: ${{ needs.earlier.outputs.tag }}
          OPEN_PR: ${{ needs.earlier.outputs.open }}
          DECLINED_PR: ${{ needs.earlier.outputs.declined }}
        run: |
          set -euo pipefail
          branch="sync-$TAG"
          subject="security(sidecar): sync copies and skills pin from $TAG"
          if [ -z "$SYNC_TOKEN" ]; then
            {
              echo "## No pull request opened"
              echo
              echo "This workflow opens the pull request with the repository secret \`KNOWLEDGE_SYNC_TOKEN\`, which is not set. The change is attached to this run as \`sync.patch\`. To open it by hand, run \`.lokf/scripts/knowledge-sync.sh --pr $TAG\` in a clone; to let the workflow open it, set the secret as the sidecar's references/automation.md says."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::KNOWLEDGE_SYNC_TOKEN is not set, so no pull request was opened; the patch is attached to this run."
            exit 0
          fi
          git config user.name "knowledge-sync[bot]"
          git config user.email "knowledge-sync[bot]@users.noreply.github.com"
          git checkout --quiet -b "$branch"
          git commit --quiet -m "$subject"
          # The branch is this workflow's own: a run a person starts after
          # a declined pull request writes over the earlier branch.
          git push --quiet --force "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          body="$RUNNER_TEMP/body.md"
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            if [ -n "$OPEN_PR" ]; then
              echo "Pull request #$OPEN_PR from this workflow is still open. A person started this run, so both move the pin: merge one and close the other."
              echo
            fi
            if [ -n "$DECLINED_PR" ]; then
              echo "Pull request #$DECLINED_PR from this workflow proposed this release and was closed without merging. A person started this run, so it proposes the release again."
              echo
            fi
            if [ -f .github/PULL_REQUEST_TEMPLATE/knowledge-sync.md ]; then
              cat .github/PULL_REQUEST_TEMPLATE/knowledge-sync.md
            fi
          } > "$body"
          base="$(GH_TOKEN="$SYNC_TOKEN" gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          url="$(GH_TOKEN="$SYNC_TOKEN" gh pr create --title "$subject" --body-file "$body" --head "$branch" --base "$base")"
          echo "Opened $url"
          { echo; echo "Pull request: $url"; } >> "$GITHUB_STEP_SUMMARY"
