name: Semantic release (version + changelog only)

# Computes the next version from Conventional Commits on `main`, using the
# same pinned semantic-release tool as the sibling plugin repositories, but
# never lets it create a tag or a release itself. `publish.yml`'s
# `gh skill publish --tag` is this repository's one and only tag creator
# (see that workflow's own header comment for why). Two tools racing to
# create the same tag would be worse than either alone. So this workflow
# only ever runs semantic-release with `--dry-run`, which performs no
# writes, no commit, no tag and no publish. That run learns the next
# version and this repository's CHANGELOG.md "## [Unreleased]" section text
# via .github/scripts/changelog-release.mjs. The workflow then promotes that
# section and commits it itself in a plain, reviewable step below, outside
# the tool's own publish lifecycle.
#
# `plan` previews every pull request into main. `release` runs on push to
# main behind the `release` GitHub Environment, the same gate `publish.yml`
# already uses. Required reviewers on it wait until releases have
# downstream users; once added, both workflows honor them.
# `publish.yml` itself is unchanged in spirit: a maintainer still runs it
# by hand with an explicit version. But that version must now match what
# this workflow already promoted into CHANGELOG.md, so a typo can no longer
# release a version nobody wrote release notes for.

on:
  pull_request:
    # `edited` matters: the title check below is the one check a person clears
    # by retitling the pull request rather than by pushing. Without it the
    # default types (opened, synchronize, reopened) never fire again, so the
    # fix the error message asks for could not clear the check it failed.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # A commit subject that releases by its type: feat, fix, perf or
      # security, or any type marked breaking by a `!`. The analyzer's
      # default rules also read FEAT and FIX in capitals. The two checks
      # below read commits and the title with this one pattern.
      RELEASING_SUBJECT: '^((feat|FEAT|fix|FIX|perf|security)(\(.*\))?!?|[A-Za-z0-9_]*(\(.*\))?!): '
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # .release/package-lock.json pins every package, each checked
      # by its hash, so a company registry can be given the exact list. The
      # link lets the release tool and its preset load from the root.
      - name: Install semantic-release from its lockfile
        run: |
          npm ci --prefix .release --no-audit --no-fund --ignore-scripts
          ln -s .release/node_modules node_modules

      # Would these commits release? Each commit is read as the pinned
      # @semantic-release/commit-analyzer reads it. .releaserc.json's
      # `releaseRules` add `security` to the analyzer's default rules and
      # replace none of them, so three kinds of commit release. The first is
      # a feat, fix, perf or security commit. The second is any type marked
      # breaking by a `!` or a BREAKING CHANGE footer. The third is a revert:
      # a message that starts "Revert" or "revert:" and says "This reverts
      # commit <hash>.", as `git revert` writes it. A `revert:` type without
      # that sentence releases nothing. The preset is named because the
      # default, angular, does not read the `!`, so it would skip a `feat!:`
      # commit altogether. Both checks below key off this one answer. Only
      # the pull request's own commits count: HEAD is GitHub's trial merge
      # with today's main, so on a branch that main has moved past,
      # "$BASE..HEAD" would read main's commits too.
      #
      # The analyzer drops a revert together with the commit it reverts when
      # that commit is not yet released. This step does not: it asks such a
      # pull request for notes, though the revert releases nothing.
      - name: Read whether these commits would release
        id: commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          releases=false
          reverts=false
          while IFS= read -r commit; do
            message="$(git log -1 --format=%B "$commit")"
            subject="${message%%$'\n'*}"
            if grep -qE "$RELEASING_SUBJECT" <<<"$subject" \
              || grep -qiE '^[[:space:]|*]*BREAKING[ -]CHANGE[:[:space:]]' <<<"$message"; then
              releases=true
            elif grep -qiE '^revert:?[[:space:]]' <<<"$subject" \
              && grep -qiE 'This reverts commit [[:alnum:]_]*\.' <<<"$message"; then
              releases=true
              reverts=true
            fi
          done < <(git rev-list "$(git merge-base "$BASE" "$HEAD_SHA")..$HEAD_SHA")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "reverts=$reverts" >> "$GITHUB_OUTPUT"
          if [ "$releases" = false ]; then
            echo "No feat, fix, perf or security commit, no breaking change and no revert here, so this pull request releases nothing."
          fi

      # semantic-release detects a pull_request event itself and exits before
      # running any plugin, including @semantic-release/exec's verifyRelease
      # hook. So the --dry-run below never calls changelog-release.mjs check
      # on this event. An empty "## [Unreleased]" would otherwise pass a
      # pull request and only fail at release time. Call it directly, but
      # only when these commits would release, or a chore-only pull request
      # (a Dependabot bump, a docs tidy) fails for lacking notes it was never
      # meant to write.
      - name: Refuse an empty changelog entry when these commits would release
        if: steps.commits.outputs.releases == 'true'
        run: node .github/scripts/changelog-release.mjs check

      # A squash merge takes its commit subject from the pull request title,
      # and GitHub's default title is the branch name in words, such as "Fix
      # deps and empty changelog (#46)", which carries no type. That merge
      # reached main and released nothing while its notes waited in
      # "## [Unreleased]". So when the commits would release, the title must
      # too: then either merge strategy releases. A revert's title releases
      # only over a commit that says which commit it reverts, since a squash
      # merge keeps that sentence in the commit's body. The title is read
      # through `env:`, never interpolated into the script, since anyone can
      # open a pull request.
      - name: Refuse a title that would lose the release on a squash merge
        if: steps.commits.outputs.releases == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          REVERTS: ${{ steps.commits.outputs.reverts }}
        run: |
          if grep -qE "$RELEASING_SUBJECT" <<<"$TITLE"; then
            echo "Title carries a releasing type, so a squash merge releases too."
          elif [ "$REVERTS" = true ] && grep -qiE '^revert:?[[:space:]]' <<<"$TITLE"; then
            echo "Title is a revert's, over a commit that says which commit it reverts, so a squash merge releases too."
          else
            echo "::error::These commits would release, but the pull request title '$TITLE' would not: it has no releasing type (feat:, fix:, perf:, security:, or a breaking '!'), and it is not a revert's title ('Revert ...') over a commit that says 'This reverts commit'. A squash merge uses the title as the commit subject and would release nothing - retitle the pull request."
            exit 1
          fi

      - name: Preview the next version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release --dry-run

  release:
    if: github.event_name == 'push'
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # This job pushes a commit to `main` itself (see below), so it keeps the
      # checkout action's default credential helper rather than disabling it,
      # like the equivalent job in the sibling plugin repositories. Nothing
      # untrusted runs here, only the pinned release tool above and this
      # repository's own reviewed script below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # .release/package-lock.json pins every package, each checked
      # by its hash, so a company registry can be given the exact list. The
      # link lets the release tool and its preset load from the root.
      - name: Install semantic-release from its lockfile
        run: |
          npm ci --prefix .release --no-audit --no-fund --ignore-scripts
          ln -s .release/node_modules node_modules

      # Always --dry-run: semantic-release computes the next version and
      # this repository's Unreleased notes but writes nothing and creates no
      # tag; see this workflow's header comment for why. The command
      # writes `next_version` to $GITHUB_OUTPUT itself (see
      # changelog-release.mjs's `notes` subcommand) only when a release is
      # due; a push with no commit that releases since the last tag
      # leaves it unset and the step below is skipped. So does a push with
      # nothing new after a promotion, such as a docs merge before
      # publish.yml runs: the version it computes is already promoted.
      - name: Compute the next version (writes nothing)
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release --dry-run

      - name: Promote CHANGELOG.md and commit
        if: steps.plan.outputs.next_version != ''
        env:
          VERSION: ${{ steps.plan.outputs.next_version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          node .github/scripts/changelog-release.mjs promote "$VERSION" "$(date -u +%Y-%m-%d)"
          # Move the sidecar template's ktl pin to the newest tag, whose
          # package publish.yml put on PyPI, or check 15 fails main one
          # release later.
          pinned=skills/ktl-sidecar/templates/pyproject.toml
          latest="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$latest" ]; then
            sed -i -E 's/("ktl==)[0-9]+\.[0-9]+\.[0-9]+"/\1'"${latest#v}"'"/' "$pinned"
          fi
          git add CHANGELOG.md "$pinned"
          git commit -m "chore(release): $VERSION - changelog promoted [skip ci]"
          git push origin HEAD:main
