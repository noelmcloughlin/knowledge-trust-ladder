name: Ask the hosts to sync

# Each host's knowledge-sync.yaml syncs it to the newest release of the
# skills on its own schedule. This workflow asks the hosts named in the
# KNOWLEDGE_SYNC_HOSTS repository variable, as owner/repo separated by
# spaces, to do it now. It runs when a PyPI run completes, so the release's
# ktl package is on PyPI first, however long the upload waited for a
# reviewer, and it runs from the default branch, where the `release`
# Environment holds its tokens. A run on another ref, a run that uploaded
# nothing, or a failed one asks nobody.
#
# The dispatch needs a token with Actions write on each host; the job's own
# token reaches no other repository and is not raised. A fine-grained token
# reaches one owner alone, so a host under lmodel takes
# KNOWLEDGE_SYNC_DISPATCH_TOKEN_LMODEL and any other host
# KNOWLEDGE_SYNC_DISPATCH_TOKEN. A host whose token is unset is skipped and
# syncs on its schedule. The variable is a list, not a switch, but it reads
# like one: "false" asks nobody, as unset does, and "true" names no host,
# which the step says. A host that cannot be dispatched is reported and the
# others go ahead.
#
# A host's uv reads the index through PyPI's cache, which trails the upload
# by a minute or so, so the step waits for the index to show both files,
# fresh and cached, before it asks. A host asked anyway asks its index
# again for a while.
on:
  workflow_run:
    workflows: [PyPI]
    types: [completed]

permissions: {}

concurrency:
  group: sync-hosts-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ask:
    name: Ask the hosts to sync
    if: github.event.workflow_run.conclusion == 'success' && vars.PYPI_RELEASE_ENABLED == 'true' && vars.KNOWLEDGE_SYNC_HOSTS != ''
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    environment: release
    permissions: {}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Ask the hosts to sync
        env:
          TOKEN_DEFAULT: ${{ secrets.KNOWLEDGE_SYNC_DISPATCH_TOKEN }}
          TOKEN_LMODEL: ${{ secrets.KNOWLEDGE_SYNC_DISPATCH_TOKEN_LMODEL }}
          HOSTS: ${{ vars.KNOWLEDGE_SYNC_HOSTS }}
          VERSION: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The PyPI run stands on the release tag, which this run reads as its branch name.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::The PyPI run was on '$VERSION', not a release tag, so no host was asked to sync."
            exit 0
          fi
          case "$(printf '%s' "$HOSTS" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')" in
            false|off|no|0|none)
              echo "::notice::KNOWLEDGE_SYNC_HOSTS is '$HOSTS', so no host was asked to sync; each syncs on its own schedule. The variable names hosts as owner/repo, and unset means the same as this."
              exit 0 ;;
            true|on|yes|1)
              echo "::warning::KNOWLEDGE_SYNC_HOSTS is '$HOSTS', which names no host, so none was asked to sync. Set it to the hosts to ask, as owner/repo separated by spaces, or leave it unset."
              exit 0 ;;
          esac
          if [ -z "$TOKEN_DEFAULT" ] && [ -z "$TOKEN_LMODEL" ]; then
            echo "::warning::KNOWLEDGE_SYNC_HOSTS names hosts, and neither KNOWLEDGE_SYNC_DISPATCH_TOKEN nor KNOWLEDGE_SYNC_DISPATCH_TOKEN_LMODEL is set, so none was asked to sync; each syncs on its own schedule."
            exit 0
          fi
          # Both files: a host's lock records the sdist's hash beside the wheel's.
          wheel="ktl-${VERSION#v}-py3-none-any.whl"
          sdist="ktl-${VERSION#v}.tar.gz"
          shows() {
            curl -fsS -H 'Accept: application/vnd.pypi.simple.v1+json' "$@" https://pypi.org/simple/ktl/ \
              | jq -e --arg w "$wheel" --arg s "$sdist" 'any(.files[]; .filename == $w) and any(.files[]; .filename == $s)' >/dev/null 2>&1
          }
          found=""
          for _ in $(seq 1 20); do
            if shows -H 'Cache-Control: no-cache'; then found=1; break; fi
            sleep 30
          done
          if [ -z "$found" ]; then
            echo "::warning::$wheel is not on PyPI ten minutes after its run, so no host was asked to sync; each syncs on its own schedule, or start its knowledge-sync.yaml once the package is there."
            exit 0
          fi
          for _ in $(seq 1 10); do
            if shows; then break; fi
            sleep 30
          done
          failed=""; unset_for=""
          for host in $HOSTS; do
            if ! printf '%s\n' "$host" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              echo "::warning::'$host' in KNOWLEDGE_SYNC_HOSTS is not owner/repo, so it was not asked to sync."
              continue
            fi
            case "${host%%/*}" in
              lmodel) token="$TOKEN_LMODEL" ;;
              *) token="$TOKEN_DEFAULT" ;;
            esac
            if [ -z "$token" ]; then
              unset_for="${unset_for}${unset_for:+ }$host"
              continue
            fi
            if GH_TOKEN="$token" gh workflow run knowledge-sync.yaml -R "$host" -f tag="$VERSION"; then
              echo "Asked $host to sync to $VERSION."
            else
              failed="${failed}${failed:+ }$host"
            fi
          done
          if [ -n "$unset_for" ]; then
            echo "::warning::No dispatch token is set for these hosts' owner, so each syncs on its own schedule: $unset_for"
          fi
          if [ -n "$failed" ]; then
            echo "::warning::These hosts could not be asked to sync, so each syncs on its own schedule: $failed"
          fi
