name: Validate

# Validate every pull request and every push to main. Separate jobs for the
# repository contract, script linting, workflow linting, the actual install
# path, and Markdown/link checks so failures are easy to diagnose at a
# glance. Also runs weekly and on demand. Link rot, an upstream `gh skill`
# spec change, or drift in what the install path resolves to would otherwise
# only be caught on the next incidental PR.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: Validate repository contract & Agent Skills spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Monitors the runner's outbound network traffic for the rest of this
      # job and flags anything unexpected. Audit mode only: it observes and
      # reports, it does not block. See
      # https://github.com/step-security/harden-runner.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The contract exercises knowledge-conventions.sh, whose parser's half
      # runs through `uv run`. Without uv it skips those rules and says so,
      # and check 11 then fails to see them.
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      # Fail visibly if `gh skill` is unavailable rather than silently
      # skipping spec validation: a missing subcommand is a broken run, not
      # a pass.
      - name: Verify gh skill support
        run: gh skill --help

      - name: Validate Agent Skills spec (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches what YAML parsing alone misses (bad expressions, wrong
      # contexts, invalid `needs:`, shellcheck on `run:` blocks). Unlike
      # `gh skill publish --dry-run`, it also reaches the two workflow
      # templates under skills/ktl-sidecar/templates/github/ that get
      # copied into other repositories and run there. With no paths given
      # actionlint looks only under .github/workflows/, so the templates are
      # named explicitly. The repository contract separately holds this
      # repository's own registrar gate byte-identical to its template.
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color .github/workflows/knowledge-librarian.yaml .github/workflows/knowledge-registrar.yaml .github/workflows/publish.yml .github/workflows/semantic-release.yml .github/workflows/validate.yml skills/ktl-sidecar/templates/github/knowledge-librarian.yaml skills/ktl-sidecar/templates/github/knowledge-registrar.yaml

      # actionlint checks syntax, not pinning. A tag or branch ref floats, so
      # every `uses:`, here and in the templates hosts copy, must name a
      # commit SHA (or an image digest). The version sits in a trailing
      # comment for Dependabot to bump.
      - name: Every action is pinned to a commit
        run: |
          if grep -rnE '^\s*-?\s*uses:' .github/workflows/ skills/ktl-sidecar/templates/github/ \
            | grep -vE '@([0-9a-f]{40}|sha256:[0-9a-f]{64})\b' \
            | grep -vE 'uses:\s*\./'; then
            echo '::error::the action(s) above are not pinned to a commit SHA' >&2
            exit 1
          fi

  smoke-test:
    name: Smoke-test the install path
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Installs from this checkout (a local path, not the published repo).
      # So a PR exercises the actual `npx skills add` install path (skill
      # discovery, full directory copy, relative-link survival) before it
      # ever reaches a real consumer.
      - name: Run the install smoke test
        run: bash scripts/smoke-test-install.sh "$GITHUB_WORKSPACE"

  validate-markdown:
    name: Lint Markdown & check links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee excludes mailto: links by default (opt in with
          # --include-mail); no flag needed to exclude them.
          args: --no-progress "**/*.md"
          fail: true

      - name: codespell
        uses: codespell-project/actions-codespell@e3258cca84ce02b0bb36a3d41f2c18f719a0cc1a # v2.4.3
        with:
          path: '**/*.md'
          # knowledge_bundle is a symlink to .lokf/knowledge (Obsidian vault
          # entry point, see ktl-sidecar Step 2), already checked at
          # its real path.
          skip: knowledge_bundle
