name: Publish

# Maintainer-gated release. `gh skill publish` creates the tag and the GitHub
# release itself, so this workflow must never be tag-triggered - a
# tag-push trigger here would race the very tag `gh skill publish` is about
# to create. `workflow_dispatch` keeps release timing an explicit human
# decision; the `release` environment (configure required reviewers on it in
# repo settings) adds a maintainer-approval gate in front of the write scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.11.0 (four skills are released together under this one tag)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish four skills
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      # semantic-release.yml computes each release's version from commits and
      # promotes it into CHANGELOG.md on every qualifying push to main (see
      # that workflow's header comment for why it stops short of tagging
      # itself); this only checks the human-typed input above still agrees
      # with what it promoted, catching the transcription error a manual
      # version number invites - not re-deciding the version.
      - name: Cross-check against the promoted changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bare="${VERSION#v}"
          top="$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [ "$bare" != "$top" ]; then
            echo "::error::Typed version '$VERSION' (bare '$bare') doesn't match CHANGELOG.md's top entry '## [$top]'. If semantic-release.yml already promoted the changelog for this release, publish '$top' instead; if it hasn't run yet on the merge you mean to release, this input is premature."
            exit 1
          fi

      # The contract exercises knowledge-conventions.sh, whose parser's half
      # runs through `uv run`; without uv it skips those rules and check 11
      # then fails to see them. validate.yml installs uv for the same reason
      # - a release runs the same contract, so it needs the same tool.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Verify repository contract
        run: bash scripts/validate-repository.sh

      - name: Validate Agent Skills spec (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh skill publish --tag "$VERSION"
