name: Publish

# Maintainer-gated release. `gh skill publish` creates the tag and the GitHub
# release itself, so this workflow must never be tag-triggered. A tag-push
# trigger here would race the very tag `gh skill publish` is about to
# create. `workflow_dispatch` keeps release timing an explicit human
# decision. The `release` environment, once it has required reviewers, adds
# a maintainer-approval gate in front of the write scope.
#
# `gh skill publish --tag` tags the head of `main`, not the commit this run
# checked out, so `publish` stops unless `main` is still the commit `verify`
# checked. After a merge during the run, start the workflow again.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.11.0 (the skills are released together under this one tag)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # The checks run the repository's own code: the contract, the test suite
  # and the packages the tests install. So they run here, under a token that
  # can only read, and the job that holds the write token runs none of it.
  verify:
    name: Verify the release candidate (read-only)
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      # semantic-release.yml computes each release's version from commits and
      # promotes it into CHANGELOG.md on every qualifying push to main (see
      # that workflow's header comment for why it stops short of tagging
      # itself). This step only checks that the human-typed input above still
      # agrees with what it promoted. It catches the transcription error a
      # manual version number invites; it does not re-decide the version.
      - name: Cross-check against the promoted changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bare="${VERSION#v}"
          top="$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [ "$bare" != "$top" ]; then
            echo "::error::Typed version '$VERSION' (bare '$bare') doesn't match CHANGELOG.md's top entry '## [$top]'. If semantic-release.yml already promoted the changelog for this release, publish '$top' instead; if it hasn't run yet on the merge you mean to release, this input is premature."
            exit 1
          fi

      # The contract exercises knowledge-conventions.sh, whose parser's half
      # runs through `uv run`. Without uv it skips those rules and check 11
      # then fails to see them. validate.yml installs uv for the same reason:
      # a release runs the same contract, so it needs the same tool. It
      # takes no uv cache, so nothing another job saved there runs in a release.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # Check 14 and the tests run changelog-release.mjs. The job restores
      # no npm cache, as it restores no uv cache.
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # shellcheck and zip come with the runner image; under CI the
      # contract fails when a tool it needs is missing.
      - name: Verify repository contract
        run: bash scripts/validate-repository.sh

      # The lokf-link recipe's tests need `just`, from .lokf/uv.lock. It
      # installs after the contract, which reads the checkout as it came.
      - name: Install just
        run: |
          uv sync --locked --project .lokf
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/.lokf/.venv/bin/just" "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The behavioural tests of the sidecar scripts ran inside the contract
      # until 2026-10-07; a release still runs them. The test packages come
      # from tests/requirements.txt, each file checked against its hash
      # there: `uv run --with-requirements` checks none, so they go into an
      # environment of their own first. One worker per CPU, as in
      # validate.yml.
      - name: Test the sidecar scripts
        run: |
          uv venv -q "$RUNNER_TEMP/tests"
          uv pip install -q --python "$RUNNER_TEMP/tests/bin/python" --require-hashes -r tests/requirements.txt
          "$RUNNER_TEMP/tests/bin/python" -m pytest -n auto

  publish:
    name: Publish the skills
    needs: verify
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    environment: release
    permissions:
      contents: write
      actions: write # dispatch knowledge-release.yaml and pypi.yml for the new tag
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # The same commit `verify` checked: both jobs check out the commit the
      # run was started on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Asked again here, after the approval: the tag may have been made
      # while the run waited.
      - name: Check the tag is still free
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      - name: Validate Agent Skills spec (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      # gh skill publish tags the head of main, so a merge during the run
      # would be tagged unchecked.
      - name: Check main is still the commit verify checked
        run: |
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$head" ]; then
            echo "::error::Could not read where main is on the remote, so nothing was published. Run the Publish workflow again."
            exit 1
          fi
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $head, and this run checked $GITHUB_SHA, so nothing was published. Run the Publish workflow again on main, so that it checks the commit it tags."
            exit 1
          fi

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh skill publish --tag "$VERSION"

      # The tag is read back, since main can still move between the check
      # and the publish.
      - name: Check the tag names the commit verify checked
        id: tagged
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --quiet origin "refs/tags/$VERSION:refs/tags/$VERSION"
          tagged="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $VERSION names $tagged, and this run checked $GITHUB_SHA: main moved as the release was made. The release exists, and no bundle zip or ktl package was requested for it. Check the tagged commit, then request each by hand, or remove the release and its tag."
            exit 1
          fi

      # The release above is made with GITHUB_TOKEN, and GitHub starts no
      # workflow from an event that token causes, so knowledge-release.yaml's
      # release trigger never fires here. A dispatch is the one exception, so
      # this step asks for the bundle zip directly, built from the tag. This
      # step and the one after it each run once the tag names the checked
      # commit, whether or not the first failed: a failed request fails the
      # job and names itself, and the other still goes out.
      - name: Attach the knowledge bundle
        if: ${{ !cancelled() && steps.tagged.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run knowledge-release.yaml --ref "$VERSION" -f tag="$VERSION" \
            || { echo "::error::The skills published under $VERSION, but the bundle zip was not requested. Run the Knowledge Release workflow by hand with tag=$VERSION."; exit 1; }

      # The same skills go to PyPI as the `ktl` package, for a machine that
      # reaches a package index and no git host. pypi.yml builds from the tag
      # and uploads where PYPI_RELEASE_ENABLED says; unset, it builds and
      # checks the package and uploads nothing. Each host finds the release
      # on its index within a day.
      - name: Publish the ktl package
        if: ${{ !cancelled() && steps.tagged.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run pypi.yml --ref "$VERSION" -f tag="$VERSION" \
            || { echo "::error::The skills published under $VERSION, but the ktl package was not requested. Run the PyPI workflow by hand on the tag: gh workflow run pypi.yml --ref $VERSION -f tag=$VERSION"; exit 1; }

