name: Publish

# Maintainer-gated release. `gh skill publish` creates the tag and the GitHub
# release itself, so this workflow must never be tag-triggered. A tag-push
# trigger here would race the very tag `gh skill publish` is about to
# create. `workflow_dispatch` keeps release timing an explicit human
# decision. The `release` environment (configure required reviewers on it in
# repo settings) adds a maintainer-approval gate in front of the write scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.11.0 (the skills are released together under this one tag)'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the skills
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write # dispatch knowledge-release.yaml for the new tag
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      # semantic-release.yml computes each release's version from commits and
      # promotes it into CHANGELOG.md on every qualifying push to main (see
      # that workflow's header comment for why it stops short of tagging
      # itself). This step only checks that the human-typed input above still
      # agrees with what it promoted. It catches the transcription error a
      # manual version number invites; it does not re-decide the version.
      - name: Cross-check against the promoted changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bare="${VERSION#v}"
          top="$(grep -m1 -E '^## \[[0-9]' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [ "$bare" != "$top" ]; then
            echo "::error::Typed version '$VERSION' (bare '$bare') doesn't match CHANGELOG.md's top entry '## [$top]'. If semantic-release.yml already promoted the changelog for this release, publish '$top' instead; if it hasn't run yet on the merge you mean to release, this input is premature."
            exit 1
          fi

      # The contract exercises knowledge-conventions.sh, whose parser's half
      # runs through `uv run`. Without uv it skips those rules and check 11
      # then fails to see them. validate.yml installs uv for the same reason:
      # a release runs the same contract, so it needs the same tool.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Verify repository contract
        run: bash scripts/validate-repository.sh

      # The behavioural tests of the sidecar scripts ran inside the contract
      # until 2026-10-07; a release still runs them.
      - name: Test the sidecar scripts
        run: uv run --no-project --with-requirements tests/requirements.txt pytest

      - name: Validate Agent Skills spec (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh skill publish --tag "$VERSION"

      # The release above is made with GITHUB_TOKEN, and GitHub starts no
      # workflow from an event that token causes, so knowledge-release.yaml's
      # release trigger never fires here. A dispatch is the one exception, so
      # this step asks for the bundle zip directly, built from the tag.
      - name: Attach the knowledge bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run knowledge-release.yaml --ref "$VERSION" -f tag="$VERSION" \
            || { echo "::error::The skills published under $VERSION, but the bundle zip was not requested. Run the Knowledge Release workflow by hand with tag=$VERSION."; exit 1; }

      # Each sibling's knowledge-sync.yaml syncs it to the newest release on
      # its own schedule. This step asks the ones named in the
      # KNOWLEDGE_SYNC_HOSTS repository variable, as owner/repo separated by
      # spaces, to do it now. The dispatch needs a token with Actions write
      # on each of them, the KNOWLEDGE_SYNC_DISPATCH_TOKEN secret; the job's
      # own token reaches no other repository. Unset, nothing is dispatched
      # and the schedule does the work. A host that cannot be dispatched is
      # reported and the others go ahead.
      - name: Ask the siblings to sync
        if: vars.KNOWLEDGE_SYNC_HOSTS != ''
        env:
          GH_TOKEN: ${{ secrets.KNOWLEDGE_SYNC_DISPATCH_TOKEN }}
          HOSTS: ${{ vars.KNOWLEDGE_SYNC_HOSTS }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::KNOWLEDGE_SYNC_HOSTS names hosts, and KNOWLEDGE_SYNC_DISPATCH_TOKEN is not set, so none was asked to sync; each syncs on its own schedule."
            exit 0
          fi
          failed=""
          for host in $HOSTS; do
            if ! printf '%s\n' "$host" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
              echo "::warning::'$host' in KNOWLEDGE_SYNC_HOSTS is not owner/repo, so it was not asked to sync."
              continue
            fi
            if gh workflow run knowledge-sync.yaml -R "$host" -f tag="$VERSION"; then
              echo "Asked $host to sync to $VERSION."
            else
              failed="${failed}${failed:+ }$host"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning::These hosts could not be asked to sync, so each syncs on its own schedule: $failed"
          fi
