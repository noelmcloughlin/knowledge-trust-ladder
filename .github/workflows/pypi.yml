name: PyPI

# Publishes the `ktl` package, the six skills and the command that installs
# them, to PyPI by trusted publishing, so a machine that reaches a package
# index and no git host can install the skills (docs/install.md). It runs no
# LLM or agent, and it never commits or pushes.
#
# publish.yml dispatches it once `gh skill publish` has made the tag, because
# GitHub starts no workflow for a release made with the default GITHUB_TOKEN.
# A maintainer can run it by hand too, naming the tag, to retry an upload.
# Either way it must run on the tag itself: `--ref "$TAG"`.
#
# The PYPI_RELEASE_ENABLED repository variable decides where the files go:
#
#   unset or "false"   nowhere: the run builds and checks the package only
#   "testpypi"         TestPyPI, through the `testpypi` environment
#   "true"             PyPI, through the `pypi` environment
#
# PyPI's trusted publisher names this workflow file and the environment, not
# the ref, so the environment is the guard: limit `pypi` and `testpypi` to
# tags matching v*, under Settings, Environments, Deployment branches and
# tags, and register each publisher once on its index with owner
# noelmcloughlin, repository knowledge-trust-ladder, workflow pypi.yml and
# that environment's name.
#
# Two jobs, for least privilege. `build` runs the build backend (third-party
# packages) under a read-only token. `upload` holds the OIDC token, runs no
# build and no repository code, and uploads only the files `build` made. The
# publish action attaches a PEP 740 attestation to each file.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, e.g. v0.64.0; run the workflow on that tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the package (read-only)
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      # The version is read from the tag, so the run must stand on it, and
      # the tag must be a release tag.
      - name: Check the run stands on the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::This run is on $REF. Run it on the tag: gh workflow run pypi.yml --ref $TAG -f tag=$TAG"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache: this job makes the files that are published, and a cache
      # another workflow can write is an input they should not have.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build the source distribution and the wheel
        run: uv build --out-dir dist

      # A version that is not the tag's would publish under the wrong name,
      # and PyPI never takes a file name twice.
      - name: Check the files carry the tag's version
        run: |
          version="${TAG#v}"
          ls dist
          test -f "dist/ktl-$version-py3-none-any.whl" || { echo "::error::No ktl-$version wheel in dist/."; exit 1; }
          test -f "dist/ktl-$version.tar.gz" || { echo "::error::No ktl-$version source distribution in dist/."; exit 1; }
          test "$(find dist -type f | wc -l)" -eq 2 || { echo "::error::dist/ holds more than the two files."; exit 1; }

      # The wheel has no dependencies, so it installs with no index at all.
      - name: Install the wheel and install the skills from it
        run: |
          uv venv -q --python 3.9 "$RUNNER_TEMP/try"
          uv pip install -q --no-index --python "$RUNNER_TEMP/try/bin/python" dist/*.whl
          "$RUNNER_TEMP/try/bin/ktl" --version
          "$RUNNER_TEMP/try/bin/ktl" skills install --dest "$RUNNER_TEMP/skills"
          diff -r skills "$RUNNER_TEMP/skills"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    name: Upload to ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'PyPI' || 'TestPyPI' }}
    needs: build
    if: vars.PYPI_RELEASE_ENABLED == 'true' || vars.PYPI_RELEASE_ENABLED == 'testpypi'
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'pypi' || 'testpypi' }}
      url: ${{ vars.PYPI_RELEASE_ENABLED == 'true' && 'https://pypi.org/project/ktl/' || 'https://test.pypi.org/project/ktl/' }}
    permissions:
      id-token: write # the OIDC token for trusted publishing
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Upload to TestPyPI
        if: vars.PYPI_RELEASE_ENABLED == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

      - name: Upload to PyPI
        if: vars.PYPI_RELEASE_ENABLED == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
