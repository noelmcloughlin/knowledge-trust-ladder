name: CodeQL

# Scans this repository's code with GitHub's CodeQL: the Python of the ktl
# package and the scripts, the JavaScript the website and the release tools
# carry, and the workflows themselves. Each finding becomes a code scanning
# alert. It runs on each pull request, each push to main, and weekly, so a new
# query reaches code that has not changed. It runs no LLM or agent, and it
# never commits or pushes.
#
# One job per language. Each reads the code without building or running it
# (build-mode: none), under a read-only token beside security-events: write,
# which the upload of its results needs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 3" # Wednesdays at 03:41 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ vars.KNOWLEDGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
